[package]
name = "rust-smp-bench"
version = "0.1.0"
edition = "2024"
description = "Tokio + Rayon multicore SMP benchmark suite paired 1:1 with Gambit Scheme SMP workloads"

[dependencies]
rayon = "1.10"
tokio = { version = "1.44", features = ["rt-multi-thread", "sync", "macros", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
