name: Multicore Formal & Weak-Memory Verification

on:
  push:
    branches: [main]
    paths:
      - 'dev/refactoring/modern-c/models/quint/v2/**'
      - 'dev/refactoring/modern-c/models/lean/**'
      - 'dev/refactoring/modern-c/models/cbmc/**'
      - 'dev/modeling/ascent/multicore-tool-routing.rules.scm'
      - 'src/gambit_smp/quint_mbt.py'
      - 'tests/test_quint_mbt.py'
      - 'tests/contracts/modern-c/weak-memory/**'
      - 'tests/contracts/modern-c/ordered-sync/**'
      - '.github/workflows/multicore-verification.yml'
      - '.github/actions/multicore-formal-tools/**'
  pull_request:
    paths:
      - 'dev/refactoring/modern-c/models/quint/v2/**'
      - 'dev/refactoring/modern-c/models/lean/**'
      - 'dev/refactoring/modern-c/models/cbmc/**'
      - 'dev/modeling/ascent/multicore-tool-routing.rules.scm'
      - 'src/gambit_smp/quint_mbt.py'
      - 'tests/test_quint_mbt.py'
      - 'tests/contracts/modern-c/weak-memory/**'
      - 'tests/contracts/modern-c/ordered-sync/**'
      - '.github/workflows/multicore-verification.yml'
      - '.github/actions/multicore-formal-tools/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quint-v2-and-ascent-routing:
    name: "Quint V2 Mutation-Killing & ASCENT Routing"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/framework
      - uses: ./.github/actions/multicore-formal-tools
        with:
          install-quint: 'true'
      - name: Run Quint V2 specs (2000 safe runs + mutation-killing suites)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for spec in \
            dev/refactoring/modern-c/models/quint/v2/binding_read_activation_v2.qnt \
            dev/refactoring/modern-c/models/quint/v2/gc_ffi_worker_domain_v2.qnt \
            dev/refactoring/modern-c/models/quint/v2/smp_migration_and_wills_v2.qnt \
            dev/refactoring/modern-c/models/quint/v2/tier31p3_still_and_rest_fastpath_v2.qnt \
            dev/refactoring/modern-c/models/quint/v2/unified_framespec_authority_v2.qnt \
            dev/refactoring/modern-c/models/quint/v2/concurrent_major_satb_v2.qnt \
            dev/refactoring/modern-c/models/quint/v2/evented_io_reactor_park_v2.qnt \
            dev/refactoring/modern-c/models/quint/v2/adaptive_heap_scaling_and_reclaim_v2.qnt \
            dev/refactoring/modern-c/models/quint/v2/gerbil_multicore_memory_challenge_v2.qnt \
            dev/refactoring/modern-c/models/quint/v2/per_domain_rest_slab_and_io_check_v2.qnt \
            dev/refactoring/modern-c/models/quint/v2/slice2_v3_immix_evac_and_slab_v2.qnt; do
            echo "=== quint test: $spec ==="
            quint test "$spec"
            echo "=== quint run --invariant=safe: $spec ==="
            quint run --invariant=safe --max-samples=2000 --max-steps=25 "$spec"
          done
      - name: Run Quint MBT, F6REST01 reverse-trace, and ASCENT routing unit tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src:tests
        run: uv run --no-sync python -m unittest tests.test_quint_mbt -v

  cbmc-weak-memory-pso:
    name: "CBMC --mm pso Weak-Memory Contracts"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/multicore-formal-tools
        with:
          install-cbmc: 'true'
      - name: Verify positive weak-memory models pass and buggy mutants fail under --mm pso
        run: |
          set -euo pipefail
          check_pso() {
            local file="$1" flag="$2"
            shift 2
            echo "=== CBMC --mm pso SAFE ($flag=1): $file ==="
            cbmc --mm pso "$@" "-D${flag}=1" "$file"
            echo "=== CBMC --mm pso MUTANT MUST FAIL ($flag=0): $file ==="
            if cbmc --mm pso "$@" "-D${flag}=0" "$file"; then
              echo "ERROR: buggy mutant was NOT caught in $file" >&2
              exit 1
            fi
          }
          check_pso tests/contracts/modern-c/weak-memory/binding_publish_pso.c USE_FENCE
          check_pso tests/contracts/modern-c/weak-memory/registry_borrow_pso.c USE_ATOMIC
          check_pso tests/contracts/modern-c/weak-memory/will_registry_cas_pso.c USE_CAS
          check_pso dev/refactoring/modern-c/models/cbmc/wave_a_still_cas_claim_pso.c USE_GUARD
          check_pso dev/refactoring/modern-c/models/cbmc/wave_a_rest_fast_span_pso.c USE_GUARD
          check_pso dev/refactoring/modern-c/models/cbmc/slice1_framespec_authority_pso.c USE_GUARD
          check_pso dev/refactoring/modern-c/models/cbmc/adaptive_heap_scaling_pso.c USE_MUTEX_GUARD --unwind 12
          check_pso dev/refactoring/modern-c/models/cbmc/slice2_satb_major_pso.c USE_SATB_GUARD
          check_pso dev/refactoring/modern-c/models/cbmc/slice2_interrupt_idle_dekker_pso.c USE_DEKKER_FENCE -DCHECK_PENDING_INTR=1 -DUSE_CARD_RELEASE=1
          check_pso dev/refactoring/modern-c/models/cbmc/per_domain_rest_slab_and_io_check_pso.c USE_POST_CHECK_FENCE
          check_pso dev/refactoring/modern-c/models/cbmc/slice2_v3_evac_and_slab_pso.c USE_SLAB_LOCK --unwind 10 --unwinding-assertions

  lean4-smp-refinements:
    name: "Lean 4 SMP & Compiled-Host Refinements"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/multicore-formal-tools
        with:
          install-lean: 'true'
      - name: Verify standalone Lean 4 proofs (0 errors, 0 warnings, 0 sorry)
        run: |
          set -euo pipefail
          for proof in \
            dev/refactoring/modern-c/models/lean/CompiledHostRefinementV2.lean \
            dev/refactoring/modern-c/models/lean/RawF64ScrubRefinement.lean \
            dev/refactoring/modern-c/models/lean/SmpMigrationAndWillsRefinement.lean \
            dev/refactoring/modern-c/models/lean/SmpIoSelectCloseRefinement.lean \
            dev/refactoring/modern-c/models/lean/LongTermUnifiedRefinement.lean \
            dev/refactoring/modern-c/models/lean/AdaptiveHeapScalingRefinement.lean \
            dev/refactoring/modern-c/models/lean/Slice2V3MemoryEndgameRefinement.lean; do
            echo "=== lean -DwarningAsError=true: $proof ==="
            lean -DwarningAsError=true "$proof"
          done

  clang-c23-tsan:
    name: "Clang C23 -Werror=comment & TSan Recon"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/multicore-formal-tools
        with:
          install-clang: 'true'
      - name: Run Clang -std=c23 -Werror=comment -fsanitize=thread positive and negative controls
        run: |
          set -euo pipefail
          cat <<'EOF' > /tmp/tsan_pos_control.c
          #include <pthread.h>
          #include <stdatomic.h>
          static _Atomic int payload = 0;
          static _Atomic int ready = 0;
          static void *writer(void *p) {
            (void)p;
            atomic_store_explicit(&payload, 42, memory_order_relaxed);
            atomic_store_explicit(&ready, 1, memory_order_release);
            return 0;
          }
          int main(void) {
            pthread_t t;
            if (pthread_create(&t, 0, writer, 0) != 0) return 1;
            while (!atomic_load_explicit(&ready, memory_order_acquire)) {}
            int v = atomic_load_explicit(&payload, memory_order_relaxed);
            pthread_join(t, 0);
            return v == 42 ? 0 : 2;
          }
          EOF
          clang -std=c23 -Werror=comment -fsanitize=thread -O1 /tmp/tsan_pos_control.c -lpthread -o /tmp/tsan_pos_control
          /tmp/tsan_pos_control
          cat <<'EOF' > /tmp/tsan_neg_control.c
          #include <pthread.h>
          #include <stdatomic.h>
          static _Atomic int arrived = 0;
          static int racy = 0;
          __attribute__((noinline)) static void bump(int *p) { *p += 1; }
          static void *worker(void *p) {
            (void)p;
            atomic_fetch_add_explicit(&arrived, 1, memory_order_relaxed);
            while (atomic_load_explicit(&arrived, memory_order_relaxed) < 2) {}
            for (int i = 0; i < 10000; ++i) bump(&racy);
            return 0;
          }
          int main(void) {
            pthread_t a, b;
            pthread_create(&a, 0, worker, 0);
            pthread_create(&b, 0, worker, 0);
            pthread_join(a, 0);
            pthread_join(b, 0);
            return racy > 0 ? 0 : 1;
          }
          EOF
          clang -std=c23 -fsanitize=thread -O1 /tmp/tsan_neg_control.c -lpthread -o /tmp/tsan_neg_control
          /tmp/tsan_neg_control 2>/tmp/tsan_neg.err || true
          grep -q "WARNING: ThreadSanitizer: data race" /tmp/tsan_neg.err
