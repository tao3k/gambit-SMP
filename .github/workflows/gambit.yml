name: Gambit Three-Flag Modules

on:
  push:
    branches: [main]
    paths: ['vendor/gambit', '.github/workflows/gambit.yml', '.github/actions/framework/**', '.github/gambit/**', 'evidence/research/ci/**', 'evidence/research/execution/**', 'evidence/dsl/**', 'evidence/native-failures.json', 'evidence/fixtures/**/source.lock.json', 'pyproject.toml', 'uv.lock', 'patches/**', 'src/gambit_smp/**', 'tests/**']
  pull_request:
    paths: ['vendor/gambit', '.github/workflows/gambit.yml', '.github/actions/framework/**', '.github/gambit/**', 'evidence/research/ci/**', 'evidence/research/execution/**', 'evidence/dsl/**', 'evidence/native-failures.json', 'evidence/fixtures/**/source.lock.json', 'pyproject.toml', 'uv.lock', 'patches/**', 'src/gambit_smp/**', 'tests/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  patch-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git submodule update --init vendor/gambit vendor/chez
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Framework, patch and inventory controls (one 15s batch)
        env:
          PYTHONPATH: src:tests
        run: python -m gambit_smp.process_observation .github/gambit/contracts.json --out .cache/ci/patch-contracts
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('.cache/ci/patch-contracts/*.json') != '' }}
        with:
          name: gambit-patch-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/ci/patch-contracts/
          include-hidden-files: true
          if-no-files-found: error

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git submodule update --init vendor/gambit vendor/chez
      - uses: ./.github/actions/framework
      - name: Install upstream C build prerequisites
        run: sudo apt-get update && sudo apt-get install -y gcc make texinfo autoconf automake pkg-config
      - name: Seal the installed framework and Library
        run: uv run --no-sync gambit-smp research --seal .cache/ci/engine --gcc "$(command -v gcc)" --ascent-api "$(uv run --no-sync python -c 'import ascent; from pathlib import Path; print(Path(ascent.__file__).parent)')"
      - name: Execute the source-bound build Recipe (600s whole budget)
        run: uv run --no-sync gambit-smp research --run evidence/research/ci/three-flag-core.recipe.json --engine .cache/ci/engine --out .cache/fixtures/ci-source-core
      - name: Export the completed source-core, not a bootstrap or permission
        run: uv run --no-sync gambit-smp research --export-runtime .cache/fixtures/ci-source-core --step source-core --out .cache/ci/gambit-runtime.tar
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('.cache/fixtures/ci-source-core/*.json', '.cache/ci/*.export-*.json') != '' }}
        with:
          name: gambit-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/fixtures/ci-source-core/**/*.json
            .cache/fixtures/ci-source-core/**/*.log
            .cache/fixtures/ci-source-core/**/*.stdout
            .cache/fixtures/ci-source-core/**/*.stderr
            !.cache/fixtures/ci-source-core/run/**/source/**
            .cache/ci/*.export-*.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gambit-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/ci/gambit-runtime.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  module:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [upstream-check, gc-ffi, compile-execute, threads, tfib-stress, interrupt-stress, interrupt2-stress, terminate-stress]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git submodule update --init vendor/gambit vendor/chez
      - uses: ./.github/actions/framework
      - uses: actions/download-artifact@v4
        with:
          name: gambit-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/ci/
      - name: Match the original C toolchain inventory
        run: sudo apt-get update && sudo apt-get install -y gcc make texinfo autoconf automake pkg-config
      - name: Seal the exact installed implementation and provider
        run: uv run --no-sync gambit-smp research --seal .cache/ci/engine --gcc "$(command -v gcc)" --ascent-api "$(uv run --no-sync python -c 'import ascent; from pathlib import Path; print(Path(ascent.__file__).parent)')"
      - name: Import, review and execute the declared module (300s whole budget)
        env:
          MODULE: ${{ matrix.module }}
        run: uv run --no-sync gambit-smp research --run "evidence/research/ci/$MODULE.recipe.json" --engine .cache/ci/engine --out ".cache/fixtures/ci-$MODULE"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles(format('.cache/fixtures/ci-{0}/*.json', matrix.module)) != '' }}
        with:
          name: gambit-${{ matrix.module }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/fixtures/ci-${{ matrix.module }}/**/*.json
            .cache/fixtures/ci-${{ matrix.module }}/**/*.log
            .cache/fixtures/ci-${{ matrix.module }}/**/*.stdout
            .cache/fixtures/ci-${{ matrix.module }}/**/*.stderr
            !.cache/fixtures/ci-${{ matrix.module }}/run/**/source/**
            !.cache/fixtures/ci-${{ matrix.module }}/run/**/generation/runtime/**
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles(format('.cache/fixtures/ci-{0}/run/*/source/tests/**', matrix.module), format('.cache/fixtures/ci-{0}/run/*/shards/*/tests/**', matrix.module)) != '' }}
        with:
          name: gambit-${{ matrix.module }}-test-products-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/fixtures/ci-${{ matrix.module }}/run/*/source/tests/**
            .cache/fixtures/ci-${{ matrix.module }}/run/*/shards/*/tests/**
          include-hidden-files: true
          if-no-files-found: error

  summary:
    if: always()
    needs: [build, module, patch-contracts]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every module, including stress
        env:
          BUILD: ${{ needs.build.result }}
          MODULES: ${{ needs.module.result }}
          PATCHES: ${{ needs.patch-contracts.result }}
        run: |
          printf 'build=%s modules=%s patches=%s\n' "$BUILD" "$MODULES" "$PATCHES" >> "$GITHUB_STEP_SUMMARY"
          test "$BUILD" = success
          test "$MODULES" = success
          test "$PATCHES" = success
