name: Verify Evidence Framework
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tools/model -p 'test_*.py'
      - run: python tools/model/evidence_index.py --check
