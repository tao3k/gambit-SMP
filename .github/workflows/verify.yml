name: Verify Evidence Framework
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/framework
      - run: git submodule update --init vendor/gambit vendor/chez vendor/ocaml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the pinned Lean compiler for the proof controls
        run: |
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat models/library/lean/lean-toolchain)"
      - name: Install fixed formal verification tools into local cache
        run: |
          mkdir -p .cache/tasks/repair-9-12/ci/formal/apalache
          npm install --prefix .cache/tasks/repair-9-12/ci/formal/quint @informalsystems/quint@0.33.0
          curl --fail --location --connect-timeout 10 --max-time 15 https://github.com/apalache-mc/apalache/releases/download/v0.62.1/apalache-0.62.1.tgz --output .cache/tasks/repair-9-12/ci/formal/apalache.tgz
          echo '93fef2f381d30465eff906a2d6afa3358cb2c9adf6a8aad3bec0ded4f45432bb  .cache/tasks/repair-9-12/ci/formal/apalache.tgz' | sha256sum --check
          tar -xzf .cache/tasks/repair-9-12/ci/formal/apalache.tgz --strip-components=1 -C .cache/tasks/repair-9-12/ci/formal/apalache
          echo '880c0b2b72354816f12e9a9755829f2907071e9a181ffea1937954c23d54739d  .cache/tasks/repair-9-12/ci/formal/apalache/lib/apalache.jar' | sha256sum --check
          mkdir -p .cache/tasks/repair-9-12/ci/formal/quint-home/apalache-dist-0.62.1
          ln -s "$GITHUB_WORKSPACE/.cache/tasks/repair-9-12/ci/formal/apalache" .cache/tasks/repair-9-12/ci/formal/quint-home/apalache-dist-0.62.1/apalache
          echo "$GITHUB_WORKSPACE/.cache/tasks/repair-9-12/ci/formal/quint/node_modules/.bin" >> "$GITHUB_PATH"
          echo "QUINT_HOME=$GITHUB_WORKSPACE/.cache/tasks/repair-9-12/ci/formal/quint-home" >> "$GITHUB_ENV"
          echo "QUINT_TLC_JAR=$GITHUB_WORKSPACE/.cache/tasks/repair-9-12/ci/formal/apalache/lib/apalache.jar" >> "$GITHUB_ENV"
      - name: Seal the fixed framework and installed Library
        run: uv run --no-sync gambit-smp research --seal .cache/tasks/repair-9-12/ci/engine --gcc "$(command -v gcc)" --ascent-api "$(uv run --no-sync python -c 'import ascent; from pathlib import Path; print(Path(ascent.__file__).parent)')"
      - name: Validate the complete framework including declared sealed domains
        env:
          GAMBIT_SMP_TEST_ENGINE: ${{ github.workspace }}/.cache/tasks/repair-9-12/ci/engine
        run: uv run --no-sync python -m gambit_smp.review_validation --profile full --out .cache/tasks/repair-9-12/ci/framework-validation
      - run: uv run --no-sync gambit-smp evidence --validate
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('.cache/tasks/repair-9-12/ci/framework-validation/**') != '' }}
        with:
          name: framework-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/tasks/repair-9-12/ci/framework-validation/
          include-hidden-files: true
          if-no-files-found: error
