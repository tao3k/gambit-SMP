name: Verify Evidence Framework
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests
      - run: uv run --locked gambit-smp evidence --validate
