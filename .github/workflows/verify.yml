name: Verify Evidence Framework
on:
  push:
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/framework
      - run: uv run --no-sync python -m unittest discover -s tests
      - run: uv run --no-sync gambit-smp evidence --validate
