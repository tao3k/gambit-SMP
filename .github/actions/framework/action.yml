name: Install the source-bound Python framework
description: Install packaged dependencies only; never compile a downstream Scheme Library
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - uses: astral-sh/setup-uv@v6
      with:
        version: '0.11.3'
    - name: Install locked dependencies (ASCENT source compilation is forbidden)
      shell: bash
      run: uv sync --locked --no-editable --no-build-package gerbil-ascent
