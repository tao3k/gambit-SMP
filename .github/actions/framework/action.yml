name: Install the source-bound Python framework
description: Install the locked Python project and its ASCENT dependency
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - uses: astral-sh/setup-uv@v6
      with:
        version: '0.11.3'
    - name: Install locked framework dependencies
      shell: bash
      run: uv sync --locked --python 3.14 --no-editable
