name: Install the source-bound Python framework
description: Install packaged dependencies only; never compile a downstream Scheme Library
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - uses: astral-sh/setup-uv@v6
      with:
        version: '0.11.3'
    - name: Download the locked qualified Library wheel
      uses: actions/download-artifact@v4
      with:
        repository: tao3k/gerbil-ascent
        run-id: 38908711765
        artifact-ids: 12049643102
        github-token: ${{ github.token }}
        path: .cache/ci/library
        merge-multiple: true
    - name: Install the framework without compiling its Library dependency
      shell: bash
      run: uv sync --locked --python 3.14 --no-editable --no-install-package gerbil-ascent
    - name: Install the hash-locked binary Library (no dependencies or source builds)
      shell: bash
      run: uv pip install --python .venv/bin/python --no-deps --no-build --require-hashes -r integrations/ascent/ci-linux.requirements.txt
