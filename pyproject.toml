[project]
name = "gambit-smp"
version = "0.1.0"
description = "Source-grounded Gambit SMP models, native checks, and evidence admission"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gerbil-ascent==0.1.0",
]

[project.scripts]
gambit-smp = "gambit_smp.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.3,<0.12"

[tool.uv.sources]
gerbil-ascent = { git = "https://github.com/tao3k/gerbil-ascent", rev = "3a5525376206ddea41ed91ed5a6dcd3374b3eab1", subdirectory = "python" }
