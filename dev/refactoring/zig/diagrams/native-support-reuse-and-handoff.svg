		.d2-1451322087 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="c2VtYW50aWM="><g class="shape" ><rect x="276" y="0" width="354" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="453" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="453" dy="0">Retain Gambit Scheme authority</tspan><tspan x="453" dy="17.666667">Object identity / equality / discovery order</tspan><tspan x="453" dy="17.666667">Existing ordered tables, vectors and queues</tspan></text></g><g class="ZnJlZXpl"><g class="shape" ><rect x="253" y="198" width="400" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="453" y="236.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="453" dy="0">Immutable semantic revision</tspan><tspan x="453" dy="17.666667">Declared dense IDs + counts + validated references</tspan><tspan x="453" dy="17.666667">No raw movable Scheme addresses</tspan></text></g><g class="aGFuZG9mZg=="><g class="shape" ><rect x="225" y="396" width="456" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="453" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="453" dy="0">Choose handoff independently of language</tspan><tspan x="453" dy="17.666667">HT1 per-record / HT2 bounded batches / HT3 snapshot</tspan><tspan x="453" dy="17.666667">Conversion + ownership + prefix failure + close obligations</tspan></text></g><g class="bmF0aXZl"><g class="shape" ><rect x="199" y="594" width="507" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="452.5" y="632.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="452.5" dy="0">One common native physical planner</tspan><tspan x="452.5" dy="17.666667">C or Zig implementation</tspan><tspan x="452.5" dy="17.666667">No duplicate semantic interning; no required resident source sum</tspan></text></g><g class="b3V0cHV0cw=="><g class="shape" ><rect x="486" y="800" width="412" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="692" y="838.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="692" dy="0">Shared physical decisions</tspan><tspan x="692" dy="17.666667">C output + native / MLIR-LLVM provider</tspan><tspan x="692" dy="17.666667">Runtime publication / roots / control remain explicit</tspan></text></g><g class="c2NvcGU="><g class="shape" ><rect x="0" y="792" width="426" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="213" y="830.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="213" dy="0">Version boundary</tspan><tspan x="213" dy="17.25">Explicit C-facing schema / lengths / ownership / status</tspan><tspan x="213" dy="17.25">Hide native containers and Zig library types</tspan><tspan x="213" dy="17.25">Charge translation, SDK and provider requalification</tspan></text></g><g class="YWNjb3VudA=="><g class="shape" ><rect x="206" y="1006" width="493" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="452.5" y="1044.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="452.5" dy="0">Fair accounting</tspan><tspan x="452.5" dy="17.25">Match handoff and capabilities before cancelling common work</tspan><tspan x="452.5" dy="17.25">Lower crossing count is a shared transport gain</tspan><tspan x="452.5" dy="17.25">One reusable generator is not maintained per generated field</tspan></text></g><g class="ZGVjaXNpb24="><g class="shape" ><rect x="252" y="1220" width="401" height="98" stroke="#0D32B2" fill="#fff0ce" class=" stroke-B1" style="stroke-width:2;" /></g><text x="452.5" y="1258.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="452.5" dy="0">Label slice alone does not justify Zig adoption</tspan><tspan x="452.5" dy="17.666667">Shared contract reconstruction remains valuable</tspan><tspan x="452.5" dy="17.666667">TG5 not passed; no implementation or native tests</tspan></text></g><g class="KHNlbWFudGljIC0mZ3Q7IGZyZWV6ZSlbMF0="><marker id="mk-d2-1451322087-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 452.5 100 C 452.5 138 452.5 158 452.5 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1451322087-3488378134)" mask="url(#d2-1451322087)" /></g><g class="KGZyZWV6ZSAtJmd0OyBoYW5kb2ZmKVswXQ=="><path d="M 452.5 298 C 452.5 336 452.5 356 452.5 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1451322087-3488378134)" mask="url(#d2-1451322087)" /></g><g class="KGhhbmRvZmYgLSZndDsgbmF0aXZlKVswXQ=="><path d="M 452.5 496 C 452.5 534 452.5 554 452.5 590" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1451322087-3488378134)" mask="url(#d2-1451322087)" /></g><g class="KG5hdGl2ZSAtJmd0OyBvdXRwdXRzKVswXQ=="><path d="M 572.848406 692.763804 C 667.79