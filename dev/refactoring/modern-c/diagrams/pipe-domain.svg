g><g class="d2FpdA=="><g class="shape" ><rect x="1620" y="453" width="242" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1741" y="491.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1741" dy="0">Release → wait → reacquire</tspan><tspan x="1741" dy="17.666667">recheck actual predicate</tspan><tspan x="1741" dy="17.666667">timeout hook exits released</tspan></text></g><g class="Z2M="><g class="shape" ><rect x="857" y="0" width="288" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1001" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1001" dy="0">Existing Scheme roots / GC</tspan><tspan x="1001" dy="17.666667">shared mutex alias remains traced</tspan><tspan x="1001" dy="17.666667">no native pointer cache</tspan></text></g><g class="Y2xvc2U="><g class="shape" ><rect x="873" y="410" width="256" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1001" y="448.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1001" dy="0">Close publication + peer wake</tspan><tspan x="1001" dy="18.5">under the same domain</tspan></text></g><g class="Z2VuZXJhdGlvbg=="><g class="shape" ><rect x="0" y="142" width="334" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="167" y="180.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="167" dy="0">One IO generation + five linker recipes</tspan><tspan x="167" dy="17.666667">50 unchanged generated artifacts reused</tspan><tspan x="167" dy="17.666667">existing Make / C23 / same workspace</tspan></text></g><g class="bW9kZWxz"><g class="shape" ><rect x="880" y="552" width="242" height="98" stroke="#0D32B2" fill="#F7F8FE" cla