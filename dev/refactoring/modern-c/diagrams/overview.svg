16px">Retire implicit macros after caller migration</text></g><g class="Ym91bmRhcnk="><g class="shape" ><rect x="391" y="664" width="523" height="82" stroke="#0D32B2" fill="#FFF0E5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="652.5" y="702.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="652.5" dy="0">Retain the C backend, C ABI, FFI and embedding as core capabilities.</tspan><tspan x="652.5" dy="18.5">Design/model qualification is not native acceptance</tspan></text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ=="><marker id="mk-d2-1485991674-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 652 68 C 652 106 652 126 652 162" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1485991674-3488378134)" mask="url(#d2-1485991674)" /></g><g class="KG4xIC0mZ3Q7IG4yKVswXQ=="><path d="M 652 234 C 652 272 652 292 652 328" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1485991674-3488378134)" mask="url(#d2-1485991674)" /></g><g class="KG4yIC0mZ3Q7IG4zKVswXQ=="><path d="M 652 400 C 652 438 652 458 652 494" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1485991674-3488378134)" mask="url(#d2-1485991674)" /></g><g class="KG4zIC0mZ3Q7IGJvdW5kYXJ5KVswXQ=="><path d="M 652 566 C 652 604 652 624 652 660" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1485991674-3488378134)" mask="url(#d2-1485991674)" /></g><mask id="d2-1485991674" maskUnits="userSpaceOnUse" x="-41" y="-41" width="996" height="828">
