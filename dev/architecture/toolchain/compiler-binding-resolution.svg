		.d2-384372755 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="c3RhdHVz"><g class="shape" ><rect x="12" y="12" width="311" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="167.5" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">ISOLATED-RESEARCH-NOT-FIRST-REV</text></g><g class="b3duZXI="><g class="shape" ><rect x="343" y="12" width="712" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="699" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Scheme compiler frontend; separate from runtime context/participant/worker responsibilities</text></g><g class="cGhhc2Vz"><g class="shape" ><rect x="1075" y="12" width="1771" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1960.5" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Scheme reader, lexical/macro resolution and path handling precede generated C. GCC C preprocessing and macro diagnostics are a different phase. Neither sampled frontend activity nor a partial C prefix establishes a C-preprocessor or GC defect.</text></g><g class="ZGlzcG9zaXRpb24="><g class="shape" ><rect x="1164" y="239" width="1592" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1960" y="277.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Remove all four proposal paths from vendor first-REV source. Retain patch, native successes/failures and a compiler-only seed for independent research. Current SDK research cohort is not a mainline producer credential.</text></g><g class="Zmlyc3RfcmV2X2FkbWlzc2lvbg=="><g class="shape" ><rect x="1921" y="466" width="79" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1960.5" y="504.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">false</text></g><g class="KHBoYXNlcyAtJmd0OyBkaXNwb3NpdGlvbilbMF0="><marker id="mk-d2-384372755-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 1960.5 80 L 1960.5 235" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-384372755-3488378134)" mask="url(#d2-384372755)" /><text x="1960.5" y="164" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">separate research ownership</text></g><g class="KGRpc3Bvc2l0aW9uIC0mZ3Q7IGZpcnN0X3Jldl9hZG1pc3Npb24pWzBd"><path d="M 1960.5 307 L 1960.5 462" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-384372755-3488378134)" mask="url(#d2-384372755)" /><text x="1960.5" y="391" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">excluded from runtime REV</text></g><mask id="d2-384372755" maskUnits="userSpaceOnUse" x="-89" y="-89" width="3036" height="722">
