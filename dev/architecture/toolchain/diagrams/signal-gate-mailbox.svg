		.d2-387899147 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="ZGVyaXZlZC1jcmVkaXQ="><g class="shape" ><rect x="1102" y="230" width="396" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1300" y="268.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1300" dy="0">derived-credit</tspan><tspan x="1300" dy="17.25">Atomic exchange owns one coalescible batch;</tspan><tspan x="1300" dy="17.25">concurrent publications remain pending; no load-</tspan><tspan x="1300" dy="17.25">then-clear and no count-from-bit inference</tspan></text></g><g class="Y2Fz"><g class="shape" ><rect x="836" y="872" width="418" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1045" y="910.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1045" dy="0">cas</tspan><tspan x="1045" dy="17.25">One strong CAS on coherent unsigned gate snapshot;</tspan><tspan x="1045" dy="17.25">failure updates expected but grants no pin/route</tspan><tspan x="1045" dy="17.25">access; bounded fallback only for admitted reason</tspan></text></g><g class="b3ZlcmZsb3c="><g class="shape" ><rect x="495" y="658" width="402" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="696" y="696.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="696" dy="0">overflow</tspan><tspan x="696" dy="17.25">Count saturation denies before increment; no field</tspan><tspan x="696" dy="17.25">carry or modular generation reuse; exhausted</tspan><tspan x="696" dy="17.25">generation seals slot</tspan></text></g><g class="c3RvcmFnZS1jb21taXQ="><g class="shape" ><rect x="851" y="1086" width="389" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1045.5" y="1124.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1045.5" dy="0">storage-commit</tspan><tspan x="1045.5" dy="17.25">Target VM lease, handler pins, selected work and</tspan><tspan x="1045.5" dy="17.25">old-roster/native retirement receipts must close</tspan><tspan x="1045.5" dy="17.25">before VM deletion</tspan></text></g><g class="bWFpbGJveA=="><g class="shape" ><rect x="1080" y="444" width="440" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1300" y="482.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1300" dy="0">mailbox</tspan><tspan x="1300" dy="17.25">Process-lifetime shell owns denied reasons after old</tspan><tspan x="1300" dy="17.25">VM retirement; mailbox contains no Scheme/VM pointer</tspan><tspan x="1300" dy="17.25">and survives completion of old batch</tspan></text></g><g class="c2VtYW50aWM="><g class="shape" ><rect x="1223" y="0" width="415" height="130" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1430.5" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1430.5" dy="0">semantic</tspan><tspan x="1430.5" dy="17">Only process-scoped coalescible native reasons with</tspan><tspan x="1430.5" dy="17">generation-invariant meaning admit this fallback;</tspan><tspan x="1430.5" dy="17">source behavior alone does not prove policy</tspan><tspan x="1430.5" dy="17">equivalence</tspan></text></g><g class="YmluZGluZw=="><g class="shape" ><rect x="1091" y="658" width="419" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1300.5" y="696.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1300.5" dy="0">binding</tspan><tspan x="1300.5" dy="17.25">Normal process custodian explicitly authorizes batch</tspan><tspan x="1300.5" dy="17.25">target under lease; unknown decision retains</tspan><tspan x="1300.5" dy="17.25">original lease, never auto-rebinds next VM</tspan></text></g><g class="cGFydGljaXBhbnQ="><g class="shape" ><rect x="374" y="872" width="402" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="575" y="910.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="575" dy="0">participant</tspan><tspan x="575" dy="17.25">Bound work keeps real target VM and old roster</tspan><tspan x="575" dy="17.25">serviceable; semantic mailbox bits are not sync-op</tspan><tspan x="575" dy="17.25">completion</tspan></text></g><g class="cHJvb2Y="><g class="shape" ><rect x="826" y="1300" width="438" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1045" y="1338.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">SysML -&gt; ASCENT -&gt; QNT / Lean; source + platform OPEN</text></g><g class="Z2FpbjA="><g class="shape" ><rect x="0" y="1474" width="416" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="208" y="1512.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="208" dy="0">gate-cost</tspan><tspan x="208" dy="17.666667">Logical operation counts only; packing must be lock-</tspan><tspan x="208" dy="17.666667">free and all fields use the same atomic protocol</tspan></text></g><g class="Z2FpbjE="><g class="shape" ><rect x="476" y="1466" width="436" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="694" y="1504.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="694" dy="0">batching</tspan><tspan x="694" dy="17.25">Only equivalent reason effects may merge; counted</tspan><tspan x="694" dy="17.25">payloads and policy-dependent identities require other</tspan><tspan x="694" dy="17.25">transport</tspan></text></g><g class="Z2FpbjI="><g class="shape" ><rect x="972" y="1474" width="432" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1188" y="1512.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1188" dy="0">lifetime</tspan><tspan x="1188" dy="17.666667">Mailbox does not eliminate required roots for VM-</tspan><tspan x="1188" dy="17.666667">specific payloads; no automatic new-generation target</tspan></text></g><g class="Z2FpbjM="><g class="shape" ><rect x="1464" y="1474" width="417" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1672.5" y="1512.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1672.5" dy="0">language</tspan><tspan x="1672.5" dy="17.666667">Zig cannot remove CAS, coalescing, policy or lifetime</tspan><tspan x="1672.5" dy="17.666667">proofs; no extra language net benefit established</tspan></text></g><g class="KG92ZXJmbG93IC0mZ3Q7IGNhcylbMF0="><marker id="mk-d2-387899147-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 695.5 774 C 695.5 812 728.099976 832 854.675871 870.826954" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-387899147-3488378134)" mask="url(#d2-387899147)" /></g><g class="KHNlbWFudGljIC0mZ3Q7IGNhcylbMF0="><path d="M 1504.753518 131.318876 C 1548.849976 170 1560.25 201.399994 1560.25 233.5 C 1560.25 265.600006 1560.25 308.399994 1560.25 340.5 C 1560.25 372.600006 1560.25 415.399994 1560.25 447.5 C 1560.25 479.600006 1560.25 522.400024 1560.25 554.5 C 1560.25 586.599976 1560.25 629.400024 1560.25 661.5 C 1560.25 693.599976 1499.050049 834.715027 1258.166365 884.762304" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-387899147-3488378134)" mask="url(#d2-387899147)" /></g><g class="KHNlbWFudGljIC0mZ3Q7IGRlcml2ZWQtY3JlZGl0KVswXQ=="><path d="M 1355.746482 131.318876 C 1311.650024 170 1300.25 190 1300.25 226" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-387899147-3488378134)" mask="url(#d2-387899147)" /></g><g class="KGRlcml2ZWQtY3JlZGl0IC0mZ3Q7IG1haWxib3gpWzBd"><path d="M 1300.25 346 C 1300.25 384 1300.25 404 1300.25 440" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-387899147-3488378134)" mask="url(#d2-387899147)" /></g><g class="KG1haWxib3ggLSZndDsgYmluZGluZylbMF0="><path d="M 1300.25 560 C 1300.25 598 1300.25 618 1300.25 654" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-387899147-3488378134)" mask="url(#d2-387899147)" /></g><g class="KHNlbWFudGljIC0mZ3Q7IGJpbmRpbmcpWzBd"><path d="M 1220.831664 126.75067 C 1076.75 169.237 1040.25 201.399994 1040.25 233.5 C 1040.25 265.600006 1040.25 308.399994 1040.25 340.5 C 1040.25 372.600006 1040.25 415.399994 1040.25 447.5 C 1040.25 479.600006 1064.449951 618 1157.553188 656.472393" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-387899147-3488378134)" mask="url(#d2-387899147)" /></g><g class="KGJpbmR