<?xml version="1.0" encoding="utf-8"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" data-d2-version="v0.9.0" preserveAspectRatio="xMinYMin meet" viewBox="0 0 2083 1782"><svg class="d2-387899147 d2-svg" width="2083" height="1782" viewBox="-101 -101 2083 1782"><rect x="-101" y="-101" width="2083" height="1782" rx="0" fill="#FFFFFF" class=" fill-N7" stroke-width="0" /><style type="text/css"><![CDATA[
