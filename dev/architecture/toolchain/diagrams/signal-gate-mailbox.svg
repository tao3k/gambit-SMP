ker-end="url(#mk-d2-387899147-3488378134)" mask="url(#d2-387899147)" /></g><g class="KHByb29mIC0mZ3Q7IGdhaW4yKVswXQ=="><path d="M 1103.729015 1367.00524 C 1170.800049 1406 1188 1427.599976 1188 1470" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-387899147-3488378134)" mask="url(#d2-387899147)" /></g><g class="KHByb29mIC0mZ3Q7IGdhaW4zKVswXQ=="><path d="M 1266.232717 1362.240388 C 1590.849976 1405.194946 1672.5 1427.599976 1672.5 1470" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-387899147-3488378134)" mask="url(#d2-387899147)" /></g><mask id="d2-387899147" maskUnits="userSpaceOnUse" x="-101" y="-101" width="2083" height="1782">
