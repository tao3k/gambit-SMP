span><tspan x="682" dy="17.666667">Metadata cannot certify firing or byte fidelity</tspan><tspan x="682" dy="17.666667">Optional observer does not gate product builds</tspan></text></g><g class="bG9jYWwudG9vbHM= fact"><g class="shape" ><rect x="40" y="50" width="416" height="114" stroke="#28618A" fill="#E5F1FB" style="stroke-width:2;" /></g><text x="248" y="88.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="248" dy="0">CLT package 26.6 / SDK alias 26.5</tspan><tspan x="248" dy="17.25">clang source label 2100.1.1.101</tspan><tspan x="248" dy="17.25">ld 1267.0 -&gt; candidate libtapi 2100.0.2.6</tspan><tspan x="248" dy="17.25">Static dependency is not a mapped-provider witness</tspan></text></g><g class="bG9jYWwuZHlsZA== fact"><g class="shape" ><rect x="516" y="58" width="358" height="98" stroke="#28618A" fill="#E5F1FB" style="stroke-width:2;" /></g><text x="695" y="96.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="695" dy="0">On-disk dyld 1387.0</tspan><tspan x="695" dy="17.666667">Mach-O UUID and full-file digest</tspan><tspan x="695" dy="17.666667">Installed source correspondence unresolved</tspan></text></g><g class="bG9jYWwuY2FjaGU= fact"><g class="shape" ><rect x="934" y="50" width="364" height="114" stroke="#28618A" fill="#E5F1FB" style="stroke-width:2;" /></g><text x="1116" y="88.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1116" dy="0">ARM cache map + image-text table</tspan><tspan x="1116" dy="17.25">Subcache mapping + Mach-O load commands</tspan><tspan x="1116" dy="17.25">libdtrace image UUID and source label 413</tspan><tspan x="1116" dy="17.25">Partial byte hashes are explicitly bounded</tspan></text></g><g class="cmVmcy5oaXN0b3JpY2Fs gap"><g class="shape" ><rect x="314" y="364" width="316" height="98" stroke="#A54A3B" fill="#FBE9E7" style="stroke-width:2;" /></g><text x="472" y="402.5" fill="#0A0F25" class="t