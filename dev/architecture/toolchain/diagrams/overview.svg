="text-anchor:middle;font-size:16px">Fresh mutable instance is not a cache hit</text></g><g class="Ym91bmRhcnk="><g class="shape" ><rect x="348" y="664" width="646" height="82" stroke="#0D32B2" fill="#FFF0E5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="671" y="702.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="671" dy="0">Cache reuse is not fresh module/context instantiation or native semantic acceptance.</tspan><tspan x="671" dy="18.5">Design/model qualification is not native acceptance</tspan></text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ=="><marker id="mk-d2-2204018001-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 671 68 C 671 106 671 126 671 162" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2204018001-3488378134)" mask="url(#d2-2204018001)" /></g><g class="KG4xIC0mZ3Q7IG4yKVswXQ=="><path d="M 671 234 C 671 272 671 292 671 328" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2204018001-3488378134)" mask="url(#d2-2204018001)" /></g><g class="KG4yIC0mZ3Q7IG4zKVswXQ=="><path d="M 671 400 C 671 438 671 458 671 494" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2204018001-3488378134)" mask="url(#d2-2204018001)" /></g><g class="KG4zIC0mZ3Q7IGJvdW5kYXJ5KVswXQ=="><path d="M 671 566 C 671 604 671 624 671 660" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2204018001-3488378134)" mask="url(#d2-2204018001)" /></g><mask id="d2-2204018001" maskUnits="userSpaceOnUse" x="-41" y="-41" width="1076" height="828">
