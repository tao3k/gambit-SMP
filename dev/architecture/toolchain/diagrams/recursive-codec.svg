E" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="376" y="632.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="376" dy="0">D-WRITER</tspan><tspan x="376" dy="17.666667">Writer output and read-back are</tspan><tspan x="376" dy="17.666667">separate from stored values</tspan></text></g><g class="RF9DT0RFQw=="><g class="shape" ><rect x="237" y="792" width="278" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="376" y="830.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="376" dy="0">D-CODEC</tspan><tspan x="376" dy="17.666667">Recursive wire inverse / injection</tspan><tspan x="376" dy="17.666667">proved in the model</tspan></text></g><g class="RF9TQ0FMQVI="><g class="shape" ><rect x="154" y="990" width="270" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="289" y="1028.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="289" dy="0">D-SCALAR</tspan><tspan x="289" dy="17.666667">Frame shape is weaker than full</tspan><tspan x="289" dy="17.666667">semantic admission</tspan></text></g><g class="RF9CUklER0U="><g class="shape" ><rect x="145" y="1188" width="267" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="278.5" y="1226.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="278.5" dy="0">D-BRIDGE</tspan><tspan x="278.5" dy="17.666667">Selected linker observes five</tspan><tspan x="278.5" dy="17.666667">metadata keys plus other fields</tspan></text></g><g class="RF9DT1NU"><g class="shape" ><rect x="305" y="1386" width="259" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="434.5" y="1424.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="434.5" dy="0">D-COST</tspan><tspan x="434.5" dy="17.666667">Format cost explicit; list proof</tspan><tspan x="434.5" dy="17.666667">algorithm is not a fast codec</tspan></text></g><g class="TF9GSUVMRFM="><g class="shape" ><rect x="482" y="1188" width="286" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="625" y="1226.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="625" dy="0">L-FIELDS</tspan><tspan x="625" dy="17.666667">Full typed record / framed domain</tspan><tspan x="625" dy="17.666667">codec</tspan></text></g><g class="TF9SRUZMRUNU"><g class="shape" ><rect x="0" y="1386" width="245" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="122.5" y="1424.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="122.5" dy="0">L-REFLECT</tspan><tspan x="122.5" dy="17.666667">Encoding facts + conditional</tspan><tspan x="122.5" dy="17.666667">safety reflection</tspan></text></g><g class="KERfUFJPRFVDRVIgLSZndDsgRF9NVVRBQkxFKVswXQ=="><marker id="mk-d2-403763778-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 420.645887 99.471862 C 385.200012 138 376 158 376 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-403763778-3488378134)" mask="url(#d2-403763778)" /></g><g class="KERfTVVUQUJMRSAtJmd0OyBEX1BPTElDSUVTKVswXQ=="><path d="M 376 298 C 376 336 376 356 376 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-403763778-3488378134)" mask="url(#d2-403763778)" /></g><g class="KERfUE9MSUNJRVMgLSZndDsgRF9XUklURVIpWzBd"><path d="