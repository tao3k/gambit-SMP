		.d2-718900676 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="ZGVwbG95bWVudA== gate"><g class="shape" ><rect x="340" y="0" width="345" height="98" stroke="#A36918" fill="#FFF1D9" style="stroke-width:2;" /></g><text x="512.5" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="512.5" dy="0">C0 or C1 deployment eligibility</tspan><tspan x="512.5" dy="17.666667">Link / launch / loaded library / callback ABI</tspan><tspan x="512.5" dy="17.666667">All runtime qualification currently unrun</tspan></text></g><g class="YWJp gate"><g class="shape" ><rect x="333" y="198" width="360" height="130" stroke="#A36918" fill="#FFF1D9" style="stroke-width:2;" /></g><text x="513" y="236.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="513" dy="0">Callback contract before probe evidence</tspan><tspan x="513" dy="17">Exact C prototypes and layout</tspan><tspan x="513" dy="17">Probe base versus record address</tspan><tspan x="513" dy="17">NULL record is completion, not normal abort</tspan><tspan x="513" dy="17">Handler results use different constants</tspan></text></g><g class="YWRtaXNzaW9u gate"><g class="shape" ><rect x="320" y="428" width="385" height="114" stroke="#A36918" fill="#FFF1D9" style="stroke-width:2;" /></g><text x="512.5" y="466.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="512.5" dy="0">Inspect recipe and library call path</tspan><tspan x="512.5" dy="17.25">No zero-match suppression</tspan><tspan x="512.5" dy="17.25">No wildcard introducing excluded provider</tspan><tspan x="512.5" dy="17.25">User probe creation may grab process internally</tspan></text></g><g class="c2NvcGVz"><g class="shape" ><rect x="10" y="662" width="1069" height="174" stroke="#0D32B2" fill="#E3E9FD" class=" stroke-B1 fill-B4" style="stroke-width:2;" /></g><text x="544.5" y="649" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:28px">Independent probe scopes</text></g><g class="c2VhbA== gate"><g class="shape" ><rect x="706" y="956" width="371" height="114" stroke="#A36918" fill="#FFF1D9" style="stroke-width:2;" /></g><text x="891.5" y="994.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="891.5" dy="0">Per-scope evidence admission</tspan><tspan x="891.5" dy="17.25">Firing and fidelity + errors / loss / drain</tspan><tspan x="891.5" dy="17.25">Process-generation join if attribution required</tspan><tspan x="891.5" dy="17.25">Local facts retained without invented joins</tspan></text></g><g class="dmVyZGljdA== gate"><g class="shape" ><rect x="710" y="1170" width="363" height="98" stroke="#A36918" fill="#FFF1D9" style="stroke-width:2;" /></g><text x="891.5" y="1208.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="891.5" dy="0">Qualified scope OR explicit unresolved</tspan><tspan x="891.5" dy="17.666667">No platform-wide support certificate</tspan><tspan x="891.5" dy="17.666667">No automatic equivalence or retirement pass</tspan></text></g><g class="c2NvcGVzLmFsbG93ZWQ= candidate"><g class="shape" ><rect x="734" y="692" width="315" height="114" stroke="#6A4698" fill="#EEE8FC" style="stroke-width:2;" /></g><text x="891.5" y="730.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="891.5" dy="0">Conditional candidates</tspan><tspan x="891.5" dy="17.25">P01 health / P02-P03 scalar syscalls</tspan><tspan x="891.5" dy="17.25">P04 bounded snapshots / P05 failures</tspan><tspan x="891.5" dy="17.25">Each target ABI needs its own controls</tspan></text></g><g class="c2NvcGVzLmV4Y2x1ZGVk gap"><g class="shape" ><rect x="351" y="692" width="323" height="114" stroke="#A54A3B" fill="#FBE9E7" style="stroke-width:2;" /></g><text x="512.5" y="730.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="512.5" dy="0">Excluded or deferred</tspan><tspan x="512.5" dy="17.25">P07 user pid probes in strict L2</tspan><tspan x="512.5" dy="17.25">P08 internal kernel fbt</tspan><tspan x="512.5" dy="17.25">No implicit attach or control as fallback</tspan></text></g><g class="c2NvcGVzLnVucmVzb2x2ZWQ= gap"><g class="shape" ><rect x="40" y="692" width="251" height="114" stroke="#A54A3B" fill="#FBE9E7" style="stroke-width:2;" /></g><text x="165.5" y="730.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="165.5" dy="0">Witnesses still missing</tspan><tspan x="165.5" dy="17.25">P06 full spawn fd transitions</tspan><tspan x="165.5" dy="17.25">P09 protected-tool visibility</tspan><tspan x="165.5" dy="17.25">P10 original Scheme delivery</tspan></text></g><g class="KGRlcGxveW1lbnQgLSZndDsgYWJpKVswXQ=="><marker id="mk-d2-718900676-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 512.5 100 C 512.5 138 512.5 158 512.5 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-718900676-3488378134)" mask="url(#d2-718900676)" /></g><g class="KGFiaSAtJmd0OyBhZG1pc3Npb24pWzBd"><path d="M 512.5 330 C 512.5 368 512.5 388 512.5 424" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-718900676-3488378134)" mask="url(#d2-718900676)" /></g><g class="KGFkbWlzc2lvbiAtJmd0OyBzY29