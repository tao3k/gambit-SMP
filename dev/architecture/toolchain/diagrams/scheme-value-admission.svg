l="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="383.5" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="383.5" dy="0">V-ROOTS</tspan><tspan x="383.5" dy="17.666667">RC registration is not complete</tspan><tspan x="383.5" dy="17.666667">scanner participation</tspan></text></g><g class="cnVudGltZV9ST09UX0hBTkRPRkY="><g class="shape" ><rect x="0" y="198" width="302" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="151" y="236.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="151" dy="0">ROOT-HANDOFF</tspan><tspan x="151" dy="17.666667">Existing execution / GC / FFI contract</tspan><tspan x="151" dy="17.666667">Native closure remains OPEN</tspan></text></g><g class="Vl9SRUxPQw=="><g class="shape" ><rect x="156" y="594" width="282" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="297" y="632.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="297" dy="0">V-RELOC</tspan><tspan x="297" dy="17.666667">Logical values survive relocation;</tspan><tspan x="297" dy="17.666667">copied addresses do not</tspan></text></g><g class="Vl9XUklURVI="><g class="shape" ><rect x="530" y="792" width="260" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="660" y="830.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="660" dy="0">V-WRITER</tspan><tspan x="660" dy="17.666667">Mark/write passes require one</tspan><tspan x="660" dy="17.666667">governed value view</tspan></text></g><g class="Vl9SRUFE"><g class="shape" ><rect x="522" y="990" width="276" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="660" y="1028.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="660" dy="0">V-READ</tspan><tspan x="660" dy="17.666667">Read-back equality is consumer-</tspan><tspan x="660" dy="17.666667">specific, not heap identity</tspan></text></g><g class="Vl9BRE1JVA=="><g class="shape" ><rect x="162" y="792" width="230" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="277" y="830.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="277" dy="0">V-ADMIT</tspan><tspan x="277" dy="17.666667">Finite logical heap-to-tree</tspan><tspan x="277" dy="17.666667">admission specification</tspan></text></g><g class="Vl9DT05TVU1FUg=="><g class="shape" ><rect x="324" y="1188" width="291" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="469.5" y="1226.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="469.5" dy="0">V-CONSUMER</tspan><tspan x="469.5" dy="17.666667">Linker factorization must preserve</tspan><tspan x="469.5" dy="17.666667">symbol and alias observations</tspan></text></g><g class="Vl9DT1NU"><g class="shape" ><rect x="168" y="1386" width="274" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="305" y="1424.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="305" dy="0">V-COST</tspan><tspan x="305" dy="17.666667">Choose managed observation or</tspan><tspan x="305" dy="17.666667">rooted borrow by real need</tspan></text></g><g class="RF9TQ0FMQVI="><g class="shape" ><rect x="168" y="990" width="270" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="303" y="1028.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="303" dy="0">D-SCALAR</tspan><tspan x="303" dy="17.666667">Frame shape is weaker than full</tspan><tspan x="303" dy="17.666667">semantic admission</tspan></text></g><g class="RF9CUklER0U="><g class="shape" ><rect x="502" y="1386" width="267" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="635.5" y="1424.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="635.5" dy="0">D-BRIDGE</tspan><tspan x="635.5" dy="17.666667">Selected linker observes five</tspan><tspan x="635.5" dy="17.666667">metadata keys plus other fields</tspan></text></g><g class="KERfUFJPRFVDRVIgLSZndDsgVl9TTkFQU0hPVClbMF0="><marker id="mk-d2-1305314289-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 660 100 C 660 138 660 158 660 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1305314289-3488378134)" mask="url(#d2-1305314289)" /></g><g class="KFZfU05BUFNIT1QgLSZndDsgVl9TWU1CT0wpWzBd"><path d="M 660 298 C 660 336 660 365.799988 660 395.5 C 660 425.200012 660 554 660 590" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1305314289-3488378134)" mask="url(#d2-1305314289)" /></g><g class="KFZfU05BUFNIT1QgLSZndDsgVl9ST09UUylbMF0="><path d="M 558.95761 296.887322 C 479.950012 336 451.950012 356 423.210128 392.845991" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1305314289-3488378134)" mask="url(#d2-1305314289)" /></g><g class="KHJ1bnRpbWVfUk9PVF9IQU5ET0ZGIC0mZ3Q7IFZfUk9PVFMpWzBd"><path d="M 229.93996 297.069595 C 291.450012 336 315.049988 356 343.789872 392.845991" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1305314289-3488378134)" mask="url(#d