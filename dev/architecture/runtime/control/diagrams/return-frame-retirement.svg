="235" dy="17.666667">Generator/runtime register parameters admitted</tspan></text></g><g class="cGxhbg=="><g class="shape" ><rect x="252" y="396" width="466" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="485" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="485" dy="0">One RFD plan and both output adapters</tspan><tspan x="485" dy="17.666667">Counts / label descriptors / outline maps consume decisions</tspan><tspan x="485" dy="17.666667">No descriptor policy recomputation</tspan></text></g><g class="bmF0aXZl"><g class="shape" ><rect x="302" y="594" width="365" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="484.5" y="632.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="484.5" dy="0">Independent root / capture / frame admission</tspan><tspan x="484.5" dy="17.666667">Input domain and negative controls defined</tspan><tspan x="484.5" dy="17.666667">Design only: no native evidence supplied</tspan></text></g><g class="cm91dGU="><g class="shape" ><rect x="237" y="792" width="496" height="98" stroke="#0D32B2" fill="#e8f2ff" class=" stroke-B1" style="stroke-width:2;" /></g><text x="485" y="830.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="485" dy="0">RF01-RF04 selected-route retirement condition</tspan><tspan x="485" dy="17.666667">Every selected consumer migrated and absent-old-call evidence</tspan><tspan x="485" dy="17.666667">Same condition for C-G, C-ZT and Zig</tspan></text></g><g class="a2VlcA=="><g class="shape" ><rect x="122" y="990" width="437" height="114" stroke="#0D32B2" fill="#fff0ce" class=" stroke-B1" style="stroke-width:2;" /></g><text x="340.5" y="1028.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="340.5" dy="0">Global deletion remains separately blocked</tspan><tspan x="340.5" dy="17.25">CFUN / legacy C callers and portable reference still exist</tspan><tspan x="340.5" dy="17.25">RF05 semantic laws and RF07 runtime scanner retained</tspan><tspan x="340.5" dy="17.25">No code actually retired</tspan></text></g><g class="KHNvdXJjZSAtJmd0OyBleHRyYWN0KVswXQ=="><marker id="mk-d2-2752085266-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 470.961444 95.390814 C 681.799988 137.399994 735 158 735 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2752085266-3488378134)" mask="url(#d2-2752085266)" /></g><g class="KHNvdXJjZSAtJmd0OyBwcm9maWxlKVswXQ=="><path d="M 234.5 100 C 234.5 138 234.5 158 234.5 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2752085266-3488378134)" mask="url(#d2-2752085266)" /></g><g class="KGV4dHJhY3QgLSZndDsgcGxhbilbMF0="><path d="M 735 298 C 735 336 709.799988 356 612.717963 394.524618" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2752085266-3488378134)" mask="url(#d2-2752085266)" /></g><g class="KHByb2ZpbGUgLSZndDsgcGxhbilbMF0="><path d="M 234.5 298 C 234.5 336 259.700012 356 356.782037 394.524618" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2752085266-3488378134)" mask="url(#d2-2752085266)" /></g><g class="KHBsYW4gLSZndDsgbmF0aXZlKVswXQ=="><path d="M 484.75 496 C 484.75 534 484.75 554 484.75 590" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2752085266-3488378134)" mask="url(#d2-2752085266)" /></g><g class="KG5hdGl2ZSAtJmd0OyByb3V0ZSlbMF0="><path d="M 484.75 694 C 484.75 732 484.75 752 484.75 78