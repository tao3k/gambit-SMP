11 force</tspan><tspan x="1111.5" dy="17.666667">IPRE -&gt; all-register IFULL -&gt; PUBLISHED</tspan></text></g><g class="cGFyYW1z transition"><g class="shape" ><rect x="457" y="404" width="380" height="98" stroke="#A36918" fill="#FFF1D9" style="stroke-width:2;" /></g><text x="647" y="442.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="647" dy="0">Parameter adaptation</tspan><tspan x="647" dy="17.666667">R08 get-rest; R09 get-key; R10 get-key-rest</tspan><tspan x="647" dy="17.666667">CALL -&gt; ARGPART; no collection until packaging</tspan></text></g><g class="bWFya2Vycw== runtime"><g class="shape" ><rect x="0" y="396" width="397" height="114" stroke="#397344" fill="#E7F4E8" style="stroke-width:2;" /></g><text x="198.5" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="198.5" dy="0">Special continuation boundaries</tspan><tspan x="198.5" dy="17.25">R12 return-to-c: marker frame / matching catcher</tspan><tspan x="198.5" dy="17.25">R13 break: stack or heap caller frame</tspan><tspan x="198.5" dy="17.25">R15 denv return: saved old-denv field + frame link</tspan></text></g><g class="cmV0 runtime"><g class="shape" ><rect x="897" y="396" width="429" height="114" stroke="#397344" fill="#E7F4E8" style="stroke-width:2;" /></g><text x="1111.5" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1111.5" dy="0">R14 internal-return marker</tspan><tspan x="1111.5" dy="17.25">Actual private RETI RA is stored in the expanded frame</tspan><tspan x="1111.5" dy="17.25">Restore registers / result carrier -&gt; private point</tspan><tspan x="1111.5" dy="17.25">The marker&#39;s label metadata is not the private map</tspan></text></g><g class="Z2F0ZXM= scheme"><g class="shape" ><rect x="648" y="610" width="463" height="114" stroke="#28618A" fill="#E5F1FB" style="stroke-width:2;" /></g><text x="879.5" y="648.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="879.5" dy="0">Common product and independent qualification</tspan><tspan x="879.5" dy="17.25">Named frame features + one FrameLayout</tspan><tspan x="879.5" dy="17.25">Roots / bounds / exceptions / capture / host edges still open</tspan><tspan x="879.5" dy="17.25">Source-traceable is not native-admitted</tspan></text></g><g class="KG1hbmlmZXN0IC0mZ3Q7IGVycm9ycylbMF0="><marker id="mk-d2-3394770122-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 1089.231319 77.901713 C 1496.25 133.925003 1598.5 167.800003 1598.5 197.5 C 1598.5 227.199997 1598.5 356 1598.5 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3394770122-3488378134)" mask="url(#d2-3394770122)" /></g><g class="KG1hbmlmZXN0IC0mZ3Q7IGludGVybmFsKVswXQ=="><path d="M 996.339102 98.785941 C 1088.099976 138 1111.5 158 1111.5 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3394770122-3488378134)" mask="url(#d2-3394770122)" /></g><g class="KG1hbmlmZXN0IC0mZ3Q7IHBhcmFtcylbMF0="><path d="M 762.160898 98.785941 C 670.400024 138 647 167.800003 647 197.5 C 647 227.199997 647 357.600006 647 400" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3394770122-3488378134)" mask="url(#d2-3394770122)" /></g><g class="KG1hbmlmZXN0IC0mZ3Q7IG1hcmtlcnMpWzBd"><path d="M 669.520946 79.288698 C 293.098999 134.199997 198.5 167.800003 198.5 197.5 C 198.5 227.199997 198.5 356 198.5 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3394770122-3488378134)" mask="url(#d2-3394770122)" /></g><g class="KGludGVybmFsIC0mZ3Q7IHJldClbMF0="><path d="M 1111.5 298