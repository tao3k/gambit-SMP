		.d2-977718014 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="dGl0bGU="><g class="shape" ></g><text x="197.5" y="39" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="197.5" dy="0">UNWIND RESURRECTION NEEDS A REAL CLEAR</tspan><tspan x="197.5" dy="18.5">Function-body closure and actual caller closure are distinct</tspan></text></g><g class="cXVlc3Rpb24="><g class="shape" ><rect x="455" y="0" width="434" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="672" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="672" dy="0">Live trace saved U=1</tspan><tspan x="672" dy="18.5">Which admitted operation supplies U=0 before restore?</tspan></text></g><g class="bm9ybWFs"><g class="shape" ><rect x="722" y="182" width="382" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="913" y="220.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="913" dy="0">Ordinary core domain: base depth h &gt;= 1</tspan><tspan x="913" dy="17.25">Checks clear only C; installers OR U</tspan><tspan x="913" dy="17.25">Non-force resets see positive target depth</tspan><tspan x="913" dy="17.25">Older caller callbacks remain below nested root</tspan></text></g><g class="bm8="><g class="shape" ><rect x="697" y="396" width="431" height="98" stroke="#0D32B2" fill="#E8F4E8" class=" stroke-B1" style="stroke-width:2;" /></g><text x="912.5" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="912.5" dy="0">Conditional invariant: U stays 1</tspan><tspan x="912.5" dy="17.666667">No resurrection in this stated domain</tspan><tspan x="912.5" dy="17.666667">Excludes hooks, force/private writes, context switches</tspan></text></g><g class="cHJpdmF0ZQ=="><g class="shape" ><rect x="237" y="190" width="389" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="431.5" y="228.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="431.5" dy="0">Supplied private entry at depth 0</tspan><tspan x="431.5" dy="17.666667">TclCheckExecutionTraces -&gt; TraceExecutionProc</tspan><tspan x="431.5" dy="17.666667">Callback prefix begins with bracket substitution</tspan></text></g><g class="YnJhY2tldA=="><g class="shape" ><rect x="226" y="396" width="411" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="431.5" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="431.5" dy="0">Direct Tcl_EvalEx parses before command readiness</tspan><tspan x="431.5" dy="17.666667">Bracket depth 0 -&gt; 1; readiness rejects U</tspan><tspan x="431.5" dy="17.666667">Bracket body is NOT executed</tspan></text></g><g class="Y2xlYXI="><g class="shape" ><rect x="239" y="594" width="386" height="98" stroke="#0D32B2" fill="#DFEEFF" class=" stroke-B1" style="stroke-width:2;" /></g><text x="432" y="632.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="432" dy="0">Bracket restores depth 1 -&gt; 0</tspan><tspan x="432" dy="17.666667">Non-force TclResetCancellation predicate is true</tspan><tspan x="432" dy="17.666667">U becomes 0; ERROR is retained</tspan></text></g><g class="cmV2aXZl"><g class="shape" ><rect x="263" y="792" width="338" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="432" y="830.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="432" dy="0">Old trace whole-word restore</tspan><tspan x="432" dy="18.5">Saved U=1 returns; traceCode still ERROR</tspan></text></g><g class="Z2Fw"><g class="shape" ><rect x="221" y="974" width="421" height="114" stroke="#0D32B2" fill="#FFF0E5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="431.5" y="1012.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="431.5" dy="0">Private BODY path is closed</tspan><tspan x="431.5" dy="17.25">No existing zero-depth caller identified</tspan><tspan x="431.5" dy="17.25">Private support / installed ABI / real client unresolved</tspan><tspan x="431.5" dy="17.25">Not a reproduced Gambit or Tcl native bug</tspan></text></g><g class="KHF1ZXN0aW9uIC0mZ3Q7IG5vcm1hbClbMF0="><marker id="mk-d2-977718014-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 782.370319 82.708454 C 886.099976 122 912.5 142 912.5 178" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-977718014-3488378134)" mask="url(#d2-977718014)" /></g><g class="KG5vcm1hbCAtJmd0OyBubylbMF0="><path d="M 912.5 298 C 912.5 336 912.5 356 912.5 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-977718014-3488378134)" mask="url(#d2-977718014)" /></g><g class="KHF1ZXN0aW9uIC0mZ3Q7IHByaXZhdGUpWzBd"><path d="M 561.629681 82.708454 C 457.899994 122 431.5 143.600006 431.5 186" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-977718014-3488378134)" mask="url(#d2-977718014)" /></g><g clas