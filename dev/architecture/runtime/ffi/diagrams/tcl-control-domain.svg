655" y="396" width="343" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="826.5" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="826.5" dy="0">Conditional preservation</tspan><tspan x="826.5" dy="17.666667">same observable hook / handler / Tcl trace</tspan><tspan x="826.5" dy="17.666667">complete roots and native capabilities</tspan></text></g><g class="cmVzdWx0"><g class="shape" ><rect x="328" y="396" width="267" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="461.5" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="461.5" dy="0">Explicit new result API</tspan><tspan x="461.5" dy="17.666667">Tcl completion authority OR</tspan><tspan x="461.5" dy="17.666667">named host-outcome authority</tspan></text></g><g class="Y2FuY2Vs"><g class="shape" ><rect x="0" y="396" width="268" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="134" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="134" dy="0">Explicit Tcl cancel-unwind</tspan><tspan x="134" dy="17.666667">stronger than plain TCL_ERROR</tspan><tspan x="134" dy="17.666667">cooperative interpreter scope</tspan></text></g><g class="b3Blbg=="><g class="shape" ><rect x="143" y="594" width="310" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="298" y="632.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="298" dy="0">No hidden semantic weakening</tspan><tspan x="298" dy="17.666667">wind order / catch / event destination</tspan><tspan x="298" dy="17.666667">and progress still require proof</tspan></text></g><g class="KHNvdXJjZSAtJmd0OyBsb2NhbClbMF0="><marker id="mk-d2-2157851372-34883781