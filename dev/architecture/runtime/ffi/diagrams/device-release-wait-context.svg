>No raw managed values in native-only wait records</tspan></text></g><g class="d2FrZQ== native"><g class="shape" ><rect x="0" y="396" width="437" height="98" stroke="#0D32B2" fill="#e8f5e6" class=" stroke-B1" style="stroke-width:2;" /></g><text x="218.5" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="218.5" dy="0">Preissued WakeLease</tspan><tspan x="218.5" dy="17.666667">Publish durable reason before notification</tspan><tspan x="218.5" dy="17.666667">Recheck predicate around sleep and wake consumption</tspan></text></g><g class="cmV0dXJu native"><g class="shape" ><rect x="246" y="594" width="427" height="98" stroke="#0D32B2" fill="#e8f5e6" class=" stroke-B1" style="stroke-width:2;" /></g><text x="459.5" y="632.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="459.5" dy="0">Ready / wake / deadline / interrupted / backend error</tspan><tspan x="459.5" dy="17.666667">None alone proves task cancelled or resource released</tspan><tspan x="459.5" dy="17.666667">Resume only the admitted close stage</tspan></text></g><g class="Y2xvc2U= native"><g class="shape" ><rect x="242" y="792" width="435" height="98" stroke="#0D32B2" fill="#e8f5e6" class=" stroke-B1" style="stroke-width:2;" /></g><text x="459.5" y="830.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="459.5" dy="0">Close independent resolution and wake issuance</tspan><tspan x="459.5" dy="17.666667">Reserved stop lease -&gt; executor exit / successful join</tspan><tspan x="459.5" dy="17.666667">Drain waiters, wakers and readers before fd/buffer free</tspan></text></g><g class="bGltaXQ= open"><g class="shape" ><rect x="247" y="990" width="425" height="98" stroke="#0D32B2" fill="#fff0d0" class=" stroke-B1" style="stroke-width:2;" /></g><text x="459.5" y="1028.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="459.5" dy="0">Still requires native refinement</tspan><tspan x="459.5" dy="17.666667">No lost wake, stale fd, concurrent resize or late writer</tspan><tspan x="459.5" dy="17.666667">Source ready bit and language types are insufficient</tspan></text></g><g class="KHNvdXJjZSAtJmd0OyBjb250ZXh0KVswXQ=="><marker id="mk-d2-1429527465-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 459 100 C 459 138 459 158 459 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1429527465-3488378134)" mask="url(#d2-1429527465)" /></g><g class="KGNvbnRleHQgLSZndDsgZnJhbWUpWzBd"><path d="M 580.348406 296.763804 C 675.299988 336 699.5 356 699.5 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1429527465-3488378134)" mask="url(#d2-1429527465)" /></g><g class="KGNvbnRleHQgLSZndDsgd2FrZSlbMF0="><path d="M 337.651594 296.763804 C 242.699997 336 218.5 356 218.5 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1429527465-3488378134)" mask="url(#d2-1429527465)" /></g><g class="KGZyYW1lIC0mZ3Q7IHJldHVybilbMF0="><path d="M 699.5 496 C 699.5 534 675.299988 554 582.196811 592.472392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1429527465-3488378134)" mask="url(#d2-1429527465)" /></g><g class="KHdha2UgLSZndDsgcmV0dXJuKVswXQ=="><path d="M 218.5 496 C 218.5 534 242.699997 554 335.803189 592.472392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1429527465-3488378134)" mask="url(#d2-1429527465)" /></g><g class="KHJldHVybiAtJmd0OyBjbG9zZSlbMF0="><path d="M 459 694 C 459 732 459 752 459 788" stroke="#0D32B2" fill="none" class="connection stro