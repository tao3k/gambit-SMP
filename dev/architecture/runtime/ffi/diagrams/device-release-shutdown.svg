		.d2-1339988995 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="ZXh0ZXJuYWw= policy"><g class="shape" ><rect x="47" y="0" width="360" height="98" stroke="#0D32B2" fill="#e4efff" class=" stroke-B1" style="stroke-width:2;" /></g><text x="227" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="227" dy="0">RSD01 Close external issuance</tspan><tspan x="227" dy="17.666667">No new independent resource/task producer</tspan><tspan x="227" dy="17.666667">Existing creators and readers retain custody</tspan></text></g><g class="cHJvZHVjZXJz native"><g class="shape" ><rect x="4" y="198" width="447" height="98" stroke="#0D32B2" fill="#e8f5e6" class=" stroke-B1" style="stroke-width:2;" /></g><text x="227.5" y="236.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="227.5" dy="0">RSD02-RSD03 Quiesce and seal root producers</tspan><tspan x="227.5" dy="17.666667">Include final-GC discovery and rollback tasks</tspan><tspan x="227.5" dy="17.666667">Count bounded descendants under existing parent credit</tspan></text></g><g class="ZHJhaW4= native"><g class="shape" ><rect x="2" y="396" width="450" height="98" stroke="#0D32B2" fill="#e8f5e6" class=" stroke-B1" style="stroke-width:2;" /></g><text x="227" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="227" dy="0">RSD04 Drain work and required users</tspan><tspan x="227" dy="17.666667">Queued, active, waiting, pending publication and readers</tspan><tspan x="227" dy="17.666667">Keep pumps, owner executors, clocks and libraries live</tspan></text></g><g class="cmV0YWluZWQ= open"><g class="shape" ><rect x="20" y="594" width="415" height="98" stroke="#0D32B2" fill="#fff0d0" class=" stroke-B1" style="stroke-width:2;" /></g><text x="227.5" y="632.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="227.5" dy="0">RSD05 Resolve or transfer retained state</tspan><tspan x="227.5" dy="17.666667">Surviving custodian retains real dependency closure</tspan><tspan x="227.5" dy="17.666667">Unknown disposition blocks dependent teardown</tspan></text></g><g class="c3RvcA== native"><g class="shape" ><rect x="0" y="813" width="454" height="98" stroke="#0D32B2" fill="#e8f5e6" class=" stroke-B1" style="stroke-width:2;" /></g><text x="227" y="851.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="227" dy="0">RSD06 Stop and join executor</tspan><tspan x="227" dy="17.666667">Withdraw ordinary wake resolution; use reserved stop pin</tspan><tspan x="227" dy="17.666667">Join is thread exit, not task or resource success</tspan></text></g><g class="cGh5c2ljYWw= native"><g class="shape" ><rect x="29" y="1011" width="396" height="98" stroke="#0D32B2" fill="#e8f5e6" class=" stroke-B1" style="stroke-width:2;" /></g><text x="227" y="1049.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="227" dy="0">RSD07 Free physical service after actual drain</tspan><tspan x="227" dy="17.666667">Waiters / late wakers / directory readers all gone</tspan><tspan x="227" dy="17.666667">Then wake fds, buffers, group and service storage</tspan></text></g><g class="cHJvdmlkZXJz native"><g class="shape" ><rect x="15" y="1209" width="424" height="98" stroke="#0D32B2" fill="#e8f5e6" class=" stroke-B1" style="stroke-width:2;" /></g><text x="227" y="1247.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="227" dy="0">RSD08 Release library / image / runtime dependencies</tspan><tspan x="227" dy="17.666667">No pending destructor, native return or retained use</tspan><tspan x="227" dy="17.666667">Memory epoch complete is not native release drained</tspan></text></g><g class="b3Blbg== open"><g class="shape" ><rect x="8" y="1407" width="439" height="98" stroke="#0D32B2" fill="#fff0d0" class=" stroke-B1" style="stroke-width:2;" /></g><text x="227.5" y="1445.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="227.5" dy="0">Conditional safety, not guaranteed termination</tspan><tspan x="227.5" dy="17.666667">Finite work + cooperative peers / owners + live executor</tspan><tspan x="227.5" dy="17.666667">Empty queue or timeout alone cannot close this proof</tspan></text></g><g class="KGV4dGVybmFsIC0mZ3Q7IHByb2R1Y2VycylbMF0="><marker id="mk-d2-1339988995-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 227 100 C 227 138 227 158 227 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1339988995-3488378134)" mask="url(#d2-1339988995)" /></g><g class="KHByb2R1Y2VycyAtJmd0OyBkcmFpbilbMF0="><path d="M 227 298 C 227 336 227 356 227 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1339988995-3488378134)" mask="url(#d2-1339988995)" /></g><g class="KGRyYWluIC0mZ3Q7IHJldGFpbmVkKVswXQ=="><path d="M 227 496 C 227 534 227 554 227 590" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1339988995-3488378134)" mask="url(#d2-1339988995)" /></g><g class="KHJldGFpbmVkIC0mZ3Q7IHN0b3ApWzBd"><path d="M 227 693.5 C 227 740.299988 227 764.700012 227 809.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1339988995-3488378134)" mask="url(#d2-1339988995)" /><text x="227" y="758" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">no dependent work remains</text></g><g class="KHN0b3AgLSZndDsgcGh5c2ljYWwpWzBd"><path d="M 227 913 C 227 951 227 971 227 1007" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1339988995-3488378134)" mask="url(#d2-1339988995)" /></g><g class="KHBoeXNpY2FsIC0mZ3Q7IHByb3ZpZGVycylbMF0="><path d="M 227 1111 C 227 1149 227 1169 227 1205" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1339988995-3488378134)" mask="url(#d2-1339988995)" /></g><g class="KHByb3ZpZGVycyAtJmd0OyBvcGVuKVswXQ=="><path d="M 227 1309 C 227 1347 227 1367 227 1403" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1339988995-3488378134)" mask="url(#d2-1339988995)" /></g><mask id="d2-1339988995" maskUnits="userSpaceOnUse" x="-41" y="-41" width="536" height="1587">
