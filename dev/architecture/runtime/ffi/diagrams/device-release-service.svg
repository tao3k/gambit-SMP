		.d2-4166958734 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="Y29uc3VtZXJz source"><g class="shape" ><rect x="494" y="0" width="404" height="98" stroke="#0D32B2" fill="#e5f0ff" class=" stroke-B1" style="stroke-width:2;" /></g><text x="696" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="696" dy="0">Ten source registration expressions</tspan><tspan x="696" dy="17.666667">File/raw/process, TCP/UDP, directory, event queue</tspan><tspan x="696" dy="17.666667">One existing shared device-cleanup adapter</tspan></text></g><g class="cG9saWN5 source"><g class="shape" ><rect x="4" y="0" width="430" height="98" stroke="#0D32B2" fill="#e5f0ff" class=" stroke-B1" style="stroke-width:2;" /></g><text x="219" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="219" dy="0">Scheme/runtime owns policy</tspan><tspan x="219" dy="17.666667">Effects, origin errors, root/control and close semantics</tspan><tspan x="219" dy="17.666667">Generated default C release adapters already reused</tspan></text></g><g class="c2VydmljZQ== design"><g class="shape" ><rect x="240" y="198" width="435" height="98" stroke="#0D32B2" fill="#e9f5e5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="457.5" y="236.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="457.5" dy="0">One DeviceReleaseCoordinator</tspan><tspan x="457.5" dy="17.666667">Identity/claim + users/drain + close stages + disposition</tspan><tspan x="457.5" dy="17.666667">Modern C or Zig: same necessary full capability</tspan></text></g><g class="bGVhdmVz design"><g class="shape" ><rect x="468" y="396" width="446" height="98" stroke="#0D32B2" fill="#e9f5e5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="691" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="691" dy="0">Reuse admitted OS / library / C leaves</tspan><tspan x="691" dy="17.666667">Device close/release, SSL cleanup, native task references</tspan><tspan x="691" dy="17.666667">Explicit wait context replaces implicit PSTATE ownership</tspan></text></g><g class="Y29tcGFyaXNvbg== design"><g class="shape" ><rect x="43" y="396" width="365" height="98" stroke="#0D32B2" fill="#e9f5e5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="225.5" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="225.5" dy="0">Language increment after reuse</tspan><tspan x="225.5" dy="17.666667">C generated products + one failure funnel</tspan><tspan x="225.5" dy="17.666667">Zig typed products + lexical ordinary rollback</tspan></text></g><g class="cmV0aXJl unresolved"><g class="shape" ><rect x="1" y="594" width="449" height="98" stroke="#0D32B2" fill="#fff0d2" class=" stroke-B1" style="stroke-width:2;" /></g><text x="225.5" y="632.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="225.5" dy="0">Real retirement condition</tspan><tspan x="225.5" dy="17.666667">Old lifecycle authority and selected manual support gone</tspan><tspan x="225.5" dy="17.666667">A Zig wrapper over old authority adds a layer</tspan></text></g><g class="Y29zdA== unresolved"><g class="shape" ><rect x="0" y="792" width="450" height="98" stroke="#0D32B2" fill="#fff0d2" class=" stroke-B1" style="stroke-width:2;" /></g><text x="225" y="830.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="225" dy="0">Net benefit remains unresolved</tspan><tspan x="225" dy="17.666667">One shared body cannot earn ten-fold savings</tspan><tspan x="225" dy="17.666667">Price migration, tool/ABI, effects and async drain support</tspan></text></g><g class="KGNvbnN1bWVycyAtJmd0OyBzZXJ2aWNlKVswXQ=="><marker id="mk-d2-4166958734-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 696.25 100 C 696.25 138 672.25 158 579.942308 196.461538" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4166958734-3488378134)" mask="url(#d2-4166958734)" /></g><g class="KHBvbGljeSAtJmd0OyBzZXJ2aWNlKVswXQ=="><path d="M 219.25 100 C 219.25 138 243.25 158 335.557692 196.461538" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4166958734-3488378134)" mask="url(#d2-4166958734)" /></g><g class="KHNlcnZpY2UgLSZndDsgbGVhdmVzKVswXQ=="><path d="M 574.341504 296.780298 C 666.900024 336 690.5 356 690.5 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4166958734-3488378134)" mask="url(#d2-4166958734)" /></g><g class="KHNlcnZpY2UgLSZndDsgY29tcGFyaXNvbilbMF0="><path d="M 341.158497 296.780298 C 248.600006 336 225 356 225 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4166958734-3488378134)" mask="url(#d2-4166958734)" /></g><g class="KGNvbXBhcmlzb24gLSZndDsgcmV0aXJlKVswXQ=="><path d="M 225 496 C 225 534 225 554 225 590" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4166958734-3488378134)" mask="url(#d2-4166958734)" /></g><g class="KHJldGlyZSAtJmd0OyBjb3N0KVswXQ=="><path d="M 225 694 C 225 732 225 752 225 788" stroke="#0D32B2" fill="none" class="connection stroke-