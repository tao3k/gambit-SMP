		.d2-2322100583 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="dGl0bGU="><g class="shape" ></g><text x="194.5" y="47" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="194.5" dy="0">COROUTINE DEPTH IS RELATIVE TO THE CURRENT CALLER</tspan><tspan x="194.5" dy="18.5">Handwritten source arithmetic; no native run</tspan></text></g><g class="c3RhZ2U="><g class="shape" ><rect x="449" y="0" width="286" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="592" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="592" dy="0">Creation at command depth d</tspan><tspan x="592" dy="17.666667">Canonical list stages root: +1</tspan><tspan x="592" dy="17.666667">Explicit discount: -1; initial aux = 0</tspan></text></g><g class="cmVzdW1l"><g class="shape" ><rect x="449" y="198" width="286" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="592" y="236.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="592" dy="0">Resume suspended offset a</tspan><tspan x="592" dy="17.666667">Save current d in aux</tspan><tspan x="592" dy="17.666667">Switch ExecEnv / frames; n := d + a</tspan></text></g><g class="YWN0aXZl"><g class="shape" ><rect x="799" y="396" width="364" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="981" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="981" dy="0">Active coroutine</tspan><tspan x="981" dy="17.666667">Context carries 4 frame fields</tspan><tspan x="981" dy="17.666667">Cancellation flags remain interpreter-scoped</tspan></text></g><g class="eWllbGQ="><g class="shape" ><rect x="204" y="594" width="355" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="381.5" y="632.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="381.5" dy="0">Successful yield</tspan><tspan x="381.5" dy="17.25">n := saved caller d</tspan><tspan x="381.5" dy="17.25">aux := previous active n - d</tspan><tspan x="381.5" dy="17.25">Logical activation and resources remain live</tspan></text></g><g class="ZmFpbGVk"><g class="shape" ><rect x="619" y="602" width="367" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="802.5" y="640.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="802.5" dy="0">C stack position mismatch</tspan><tspan x="802.5" dy="17.666667">Repair possible splice reference, write ERROR</tspan><tspan x="802.5" dy="17.666667">No successful yield depth swap</tspan></text></g><g class="cm9vdA=="><g class="shape" ><rect x="1046" y="602" width="351" height="98" stroke="#0D32B2" fill="#DFEEFF" class=" stroke-B1" style="stroke-width:2;" /></g><text x="1221.5" y="640.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1221.5" dy="0">Terminal root NRCommand</tspan><tspan x="1221.5" dy="17.666667">n := n - 1 before async / cancel / limit checks</tspan><tspan x="1221.5" dy="17.666667">Ordinary d = 1 can expose n = 0</tspan></text></g><g class="Y2xlYW51cA=="><g class="shape" ><rect x="1029" y="808" width="386" height="98" stroke="#0D32B2" fill="#FFF0E5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="1222" y="846.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1222" dy="0">Terminal exit still active at discounted depth</tspan><tspan x="1222" dy="17.666667">Delete command and ExecEnv; release line table</tspan><tspan x="1222" dy="17.666667">Restore caller environment; only then n := n + 1</tspan></text></g><g class="Zmxvb3I="><g class="shape" ><rect x="1003" y="1006" width="438" height="130" stroke="#0D32B2" fill="#FFF0E5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="1222" y="1044.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1222" dy="0">Older native trace at h &gt;= 1</tspan><tspan x="1222" dy="17">Ordinary nested d &gt;= h + 1</tspan><tspan x="1222" dy="17">If offsets and callback pairing stay balanced:</tspan><tspan x="1222" dy="17">terminal d - 1 &gt;= h, no zero-depth clear beneath it</tspan><tspan x="1222" dy="17">All-history offset / pairing invariant remains unresolved</tspan></text></g><g class="KHN0YWdlIC0mZ3Q7IHJlc3VtZSlbMF0="><marker id="mk-d2-2322100583-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 592 100 C 592 138 592 158 592 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2322100583-3488378134)" mask="url(#d2-2322100583)" /></g><g class="KHJlc3VtZSAtJmd0OyBhY3RpdmUpWzBd"><path d="M 737.187473 283.496182 C 932.049988 333.399994 981.25 356 981.25 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2322100583-3488378134)" mask="url(#d2-2322100583)" /></g><g class="KGFjdGl2ZSAtJmd0OyB5aWVsZClbMF0="><path d="M 797.05919 490.482967 C 625.400024 533.200012 563.200012 554 491.53149 592.121548" stroke="#0D32B2" fill="none" class="connection stroke-B1" 