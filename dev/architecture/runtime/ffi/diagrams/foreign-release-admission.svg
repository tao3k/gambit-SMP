666667">No dependency on stopped mutator progress</tspan></text></g><g class="ZGVmZXI= design"><g class="shape" ><rect x="0" y="417" width="445" height="98" stroke="#0D32B2" fill="#e9f5e5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="222.5" y="455.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="222.5" dy="0">Owned native post-epoch release</tspan><tspan x="222.5" dy="17.666667">Explicit timing redesign; pins and executor survive</tspan><tspan x="222.5" dy="17.666667">No synchronous wait on an owner that must resume first</tspan></text></g><g class="dW5rbm93bg== unresolved"><g class="shape" ><rect x="968" y="417" width="335" height="98" stroke="#0D32B2" fill="#fff0d2" class=" stroke-B1" style="stroke-width:2;" /></g><text x="1135.5" y="455.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1135.5" dy="0">Managed / unknown / nonlocal effects</tspan><tspan x="1135.5" dy="17.666667">No direct worker admission</tspan><tspan x="1135.5" dy="17.666667">Retain or use a separately qualified route</tspan></text></g><g class="ZXBvY2g= design"><g class="shape" ><rect x="126" y="636" width="372" height="98" stroke="#0D32B2" fill="#e9f5e5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="312" y="674.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="312" dy="0">MemoryEpochComplete</tspan><tspan x="312" dy="17.666667">Roots, movement and epoch-critical work safe</tspan><tspan x="312" dy="17.666667">Does not report native resource closed</tspan></text></g><g class="ZHJhaW4= design"><g class="shape" ><rect x="266" y="855" width="457" height="98" stroke="#0D32B2" fill="#e9f5e5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="494.5" y="893.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="494.5" dy="0">NativeReleaseDrained</tspan><tspan x="494.5" dy="17.666667">Actual nativ