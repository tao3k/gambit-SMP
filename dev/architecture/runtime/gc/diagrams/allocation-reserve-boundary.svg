		.d2-2346402497 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="Y29tcGlsZXI= scheme"><g class="shape" ><rect x="839" y="8" width="411" height="98" stroke="#28618A" fill="#E5F1FB" style="stroke-width:2;" /></g><text x="1044.5" y="46.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1044.5" dy="0">G: compiler check policy</tspan><tspan x="1044.5" dy="17.666667">4096 words in inspected target</tspan><tspan x="1044.5" dy="17.666667">Committed debt + pending allocation + boxing costs</tspan></text></g><g class="bG9jYWw= runtime"><g class="shape" ><rect x="479" y="0" width="300" height="114" stroke="#397344" fill="#E7F4E8" style="stroke-width:2;" /></g><text x="629" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="629" dy="0">F: local physical msection fudge</tspan><tspan x="629" dy="17.25">8192 + 1 + SUBTYPED_BODY words</tspan><tspan x="629" dy="17.25">Soft limits set before physical slack</tspan><tspan x="629" dy="17.25">Heap and stack bounds are separate</tspan></text></g><g class="Z2xvYmFs runtime"><g class="shape" ><rect x="0" y="0" width="419" height="114" stroke="#397344" fill="#E7F4E8" style="stroke-width:2;" /></g><text x="209.5" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="209.5" dy="0">R: VM overflow reserve</tspan><tspan x="209.5" dy="17.25">8 * (parameter vector + maximum argument list cost)</tspan><tspan x="209.5" dy="17.25">Subtracted from approximate free heap</tspan><tspan x="209.5" dy="17.25">Consumed/replenished during overflow recovery</tspan></text></g><g class="Y2VydGlmaWNhdGU= gate"><g class="shape" ><rect x="400" y="235" width="459" height="114" stroke="#A36918" fill="#FFF1D9" style="stroke-width:2;" /></g><text x="629.5" y="273.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="629.5" dy="0">G3 AllocationCertificate</tspan><tspan x="629.5" dy="17.25">Every realized no-collection path must fit actual headroom</tspan><tspan x="629.5" dy="17.25">Fast/slow check branches need postconditions</tspan><tspan x="629.5" dy="17.25">Do not equate G, F and R</tspan></text></g><g class="cGFydGlhbA== gate"><g class="shape" ><rect x="382" y="449" width="494" height="114" stroke="#A36918" fill="#FFF1D9" style="stroke-width:2;" /></g><text x="629" y="487.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="629" dy="0">Rest/key partial arguments</tspan><tspan x="629" dy="17.25">Finish bound: n_left * pair_words + np + vector_header</tspan><tspan x="629" dy="17.25">Conditional loose maximum 25601 words exceeds F=8194</tspan><tspan x="629" dy="17.25">Not a demonstrated overflow; actual branch correlation is open</tspan></text></g><g class="Y29tcGxldGU= scheme"><g class="shape" ><rect x="665" y="684" width="464" height="98" stroke="#28618A" fill="#E5F1FB" style="stroke-width:2;" /></g><text x="897" y="722.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="897" dy="0">Complete parameter vector / full frame roots</tspan><tspan x="897" dy="17.666667">Only then admitted collecting service</tspan><tspan x="897" dy="17.666667">Q-reserve remains open until concrete bound is established</tspan></text></g><g class="YWx0ZXJuYXRpdmU= gate"><g class="shape" ><rect x="108" y="684" width="497" height="98" stroke="#A36918" fill="#FFF1D9" style="stroke-width:2;" /></g><text x="356.5" y="722.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="356.5" dy="0">Deferred alternative: Gambit-owned argument-root window</tspan><tspan x="356.5" dy="17.666667">Noncollecting bootstrap + scanner/publication/lifetime changes</tspan><tspan x="356.5" dy="17.666667">A Zig slice alone cannot provide moving Scheme roots</tspan></text></g><g class="KGNvbXBpbGVyIC0mZ3Q7IGNlcnRpZmljYXRlKVswXQ=="><marker id="mk-d2-2346402497-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 1044.5 107.5 C 1044.5 160.699997 1002.099976 186.699997 836.344036 234.393933" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2346402497-3488378134)" mask="url(#d2-2346402497)" /></g><g class="KGxvY2FsIC0mZ3Q7IGNlcnRpZmljYXRlKVswXQ=="><path d="M 629 115.5 C 629 162.300003 629 186.699997 629 231.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2346402497-3488378134)" mask="url(#d2-2346402497)" /></g><g class="KGdsb2JhbCAtJmd0OyBjZXJ0aWZpY2F0ZSlbMF0="><path d="M 209.5 115.5 C 209.5 162.300003 252.300003 186.699997 419.653227 234.40349" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2346402497-3488378134)" mask="url(#d2-2346402497)" /><text x="291" y="203" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">global reserve is not local-space proof</text></g><g class="KGNlcnRpZmljYXRlIC0mZ3Q7IHBhcnRpYWwpWzBd"><path d="M 629 351 C 629 389 629 409 629 445" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2346402497-3488378134)" mask="url(#d2-2346402497)" /></g><g class="KHBhcnRpYWwgLSZndDsgY29tcGxldGUpWzBd"><path d="M 761.079259 563.308585 C 869.650024 611.299988 897.25 635.700012 897.25 680.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2346402497-3488378134)" mask="url(#d2-2346402497)" /></g><g class="KHBhcnRpYWwgLSZndDsgYWx0ZXJuYXRpdmUpWzBd"><path d="M 494.916485 563.298888 C 384.75 611.299988 356.75 635.700012 356.75 680.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2346402497-3488378134)" mask="url(#d2-2346402497)" /><text x="401.5" y="610" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">separate future protocol, no fallback</text></g><mask id="d2-2346402497" maskUnits="userSpaceOnUse" x="-41" y="-41" width="1332" height="864">
