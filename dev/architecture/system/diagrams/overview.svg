-size:16px">Qualified services / named C-to-Zig replacement</text></g><g class="Ym91bmRhcnk="><g class="shape" ><rect x="344" y="664" width="627" height="82" stroke="#0D32B2" fill="#FFF0E5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="657.5" y="702.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="657.5" dy="0">C-to-Zig is a conditional implementation evolution, not a second required runtime.</tspan><tspan x="657.5" dy="18.5">Design/model qualification is not native acceptance</tspan></text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ=="><marker id="mk-d2-2139007836-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 657.5 68 C 657.5 106 657.5 126 657.5 162" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2139007836-3488378134)" mask="url(#d2-2139007836)" /></g><g class="KG4xIC0mZ3Q7IG4yKVswXQ=="><path d="M 657.5 234 C 657.5 272 657.5 292 657.5 328" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2139007836-3488378134)" mask="url(#d2-2139007836)" /></g><g class="KG4yIC0mZ3Q7IG4zKVswXQ=="><path d="M 657.5 400 C 657.5 438 657.5 458 657.5 494" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2139007836-3488378134)" mask="url(#d2-2139007836)" /></g><g class="KG4zIC0mZ3Q7IGJvdW5kYXJ5KVswXQ=="><path d="M 657.5 566 C 657.5 604 657.5 624 657.5 660" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2139007836-3488378134)" mask="url(#d2-2139007836)" /></g><mask id="d2-2139007836" maskUnits="userSpaceOnUse" x="-41" y="-41" width="1053" height="828">
