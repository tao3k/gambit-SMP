		.d2-4287976289 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="cm9vdHM= scheme"><g class="shape" ><rect x="35" y="0" width="372" height="114" stroke="#28618A" fill="#E5F1FB" style="stroke-width:2;" /></g><text x="221" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="221" dy="0">Scheme AnchorState</tspan><tspan x="221" dy="17.25">Required role / return / external entry anchors</tspan><tspan x="221" dy="17.25">Incoming contracts and named frame features</tspan><tspan x="221" dy="17.25">Separate from copied debug comments</tspan></text></g><g class="cmV3cml0ZQ== scheme"><g class="shape" ><rect x="189" y="214" width="375" height="114" stroke="#28618A" fill="#E5F1FB" style="stroke-width:2;" /></g><text x="376.5" y="252.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="376.5" dy="0">Clone / cascade / common-block / common-tail</tspan><tspan x="376.5" dy="17.25">Distinct exported entry boundaries remain</tspan><tspan x="376.5" dy="17.25">Fresh private origins and explicit lineage</tspan><tspan x="376.5" dy="17.25">Frame / effect / frontier analysis invalidation</tspan></text></g><g class="ZGVhZA== gate"><g class="shape" ><rect x="172" y="428" width="409" height="98" stroke="#A36918" fill="#FFF1D9" style="stroke-width:2;" /></g><text x="376.5" y="466.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="376.5" dy="0">Dead-code reachability</tspan><tspan x="376.5" dy="17.666667">Seed ordinary entry AND all external roots</tspan><tspan x="376.5" dy="17.666667">Runtime edges are not ordinary predecessor counts</tspan></text></g><g class="ZnVzZQ== scheme"><g class="shape" ><rect x="176" y="626" width="402" height="98" stroke="#28618A" fill="#E5F1FB" style="stroke-width:2;" /></g><text x="377" y="664.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="377" dy="0">Useless-jump fusion</tspan><tspan x="377" dy="17.666667">One Scheme predecessor does not imply one entry</tspan><tspan x="377" dy="17.666667">Do not absorb an external boundary</tspan></text></g><g class="b3JkZXI= gate"><g class="shape" ><rect x="48" y="824" width="346" height="114" stroke="#A36918" fill="#FFF1D9" style="stroke-width:2;" /></g><text x="221" y="862.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="221" dy="0">Final scheduling / renumbering</tspan><tspan x="221" dy="17.25">Seed every external root again</tspan><tspan x="221" dy="17.25">Exactly-once coverage of required anchors</tspan><tspan x="221" dy="17.25">DCE preservation alone is insufficient</tspan></text></g><g class="Y29tcGxldGlvbg== scheme"><g class="shape" ><rect x="14" y="1038" width="414" height="114" stroke="#28618A" fill="#E5F1FB" style="stroke-width:2;" /></g><text x="221" y="1076.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="221" dy="0">G3 completion + G4 freeze</tspan><tspan x="221" dy="17.25">Private check/force points and complete frames</tspan><tspan x="221" dy="17.25">One coherent CFG / anchor revision</tspan><tspan x="221" dy="17.25">Reject missing correspondence or exhausted budget</tspan></text></g><g class="emln native"><g class="shape" ><rect x="7" y="1252" width="429" height="98" stroke="#6A4698" fill="#EEE8FC" style="stroke-width:2;" /></g><text x="221.5" y="1290.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="221.5" dy="0">Zig common product planner</tspan><tspan x="221.5" dy="17.666667">Consumes preserved PointIds and obligations</tspan><tspan x="221.5" dy="17.666667">Cannot reconstruct deleted anchors from C or ordinals</tspan></text></g><g class="KHJvb3RzIC0mZ3Q7IHJld3JpdGUpWzBd"><marker id="mk-d2-4287976289-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 305.15006 115.130178 C 361.899994 154 376.5 174 376.5 210" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4287976289-3488378134)" mask="url(#d2-4287976289)" /></g><g class="KHJld3JpdGUgLSZndDsgZGVhZClbMF0="><path d="M 376.5 330 C 376.5 368 376.5 388 376.5 424" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4287976289-3488378134)" mask="url(#d2-4287976289)" /></g><g class="KGRlYWQgLSZndDsgZnVzZSlbMF0="><path d="M 376.5 528 C 376.5 566 376.5 586 376.5 622" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4287976289-3488378134)" mask="url(#d2-4287976289)" /></g><g class="KGZ1c2UgLSZndDsgb3JkZXIpWzBd"><path d="M 376.5 726 C 376.5 764 361.899994 784 306.80012 821.739644" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4287976289-3488378134)" mask="url(#d2-4287976289)" /></g><g class="KHJvb3RzIC0mZ3Q7IG9yZGVyKVswXQ=="><path d="M 137.34994 115.130178 C 80.599998 154 66 185.399994 66 217.5 C 66 249.600006 66 292.399994 66 324.5 C 66 356.600006 66 397.799988 66 427.5 C 66 457.200012 66 496.799988 66 526.5 C 66 556.200012 66 595.799988 66 625.5 C 66 655.200012 80.599998 784 135.69988 821.739644" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4287976289-3488378134)" mask="url(#d2-4287