		.d2-1214215824 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="b3JpZ2lucw== source"><g class="shape" ><rect x="35" y="0" width="419" height="98" stroke="#0D32B2" fill="#e5f0ff" class=" stroke-B1" style="stroke-width:2;" /></g><text x="244.5" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="244.5" dy="0">Actual release origins</tspan><tspan x="244.5" dy="17.666667">GC / explicit release / conversion rollback / shutdown</tspan><tspan x="244.5" dy="17.666667">Different result and execution contexts</tspan></text></g><g class="Y2xhaW0= design"><g class="shape" ><rect x="46" y="198" width="397" height="98" stroke="#0D32B2" fill="#e9f5e5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="244.5" y="236.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="244.5" dy="0">Proposed ResourceId + unique release claim</tspan><tspan x="244.5" dy="17.666667">Close independent issuance; drain actual borrows</tspan><tspan x="244.5" dy="17.666667">Wrapper flag alone cannot arbitrate all owners</tspan></text></g><g class="Y3VzdG9keQ== design"><g class="shape" ><rect x="28" y="396" width="432" height="98" stroke="#0D32B2" fill="#e9f5e5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="244" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="244" dy="0">Own native payload, callback image and action inputs</tspan><tspan x="244" dy="17.666667">Transfer use before dropping wrapper/creator custody</tspan><tspan x="244" dy="17.666667">Managed dependencies published before final root cut</tspan></text></g><g class="cnVu design"><g class="shape" ><rect x="33" y="594" width="422" height="98" stroke="#0D32B2" fill="#e9f5e5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="244" y="632.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="244" dy="0">Qualified executor + effect interval</tspan><tspan x="244" dy="17.666667">ReadClose / Wait / WriteClose / Wait / FinalRelease</tspan><tspan x="244" dy="17.666667">No collector or metadata lock held across native code</tspan></text></g><g class="cmVzdWx0 design"><g class="shape" ><rect x="46" y="792" width="396" height="98" stroke="#0D32B2" fill="#e9f5e5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="244" y="830.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="244" dy="0">Record status AND payload disposition</tspan><tspan x="244" dy="17.666667">Alive-partial / freed / unknown</tspan><tspan x="244" dy="17.666667">Error alone never authorizes retry or another free</tspan></text></g><g class="ZmluaXNo design"><g class="shape" ><rect x="42" y="990" width="405" height="98" stroke="#0D32B2" fill="#e9f5e5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="244.5" y="1028.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="244.5" dy="0">Origin-preserving completion</tspan><tspan x="244.5" dy="17.666667">Explicit result/exception; rollback primary error</tspan><tspan x="244.5" dy="17.666667">GC/shutdown safe retention and diagnostics policy</tspan></text></g><g class="bGltaXQ= unresolved"><g class="shape" ><rect x="0" y="1188" width="488" height="98" stroke="#0D32B2" fill="#fff0d2" class=" stroke-B1" style="stroke-width:2;" /></g><text x="244" y="1226.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="244" dy="0">Conditional closure only</tspan><tspan x="244" dy="17.666667">Raw aliases, custom effects, libraries and native ordering open</tspan><tspan x="244" dy="17.666667">No independent worker profile qualified here</tspan></text></g><g class="KG9yaWdpbnMgLSZndDsgY2xhaW0pWzBd"><marker id="mk-d2-1214215824-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 244 100 C 244 138 244 158 244 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1214215824-3488378134)" mask="url(#d2-1214215824)" /></g><g class="KGNsYWltIC0mZ3Q7IGN1c3RvZHkpWzBd"><path d="M 244 298 C 244 336 244 356 244 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1214215824-3488378134)" mask="url(#d2-1214215824)" /></g><g class="KGN1c3RvZHkgLSZndDsgcnVuKVswXQ=="><path d="M 244 496 C 244 534 244 554 244 590" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1214215824-3488378134)" mask="url(#d2-1214215824)" /></g><g class="KHJ1biAtJmd0OyByZXN1bHQpWzBd"><path d="M 244 694 C 244 732 244 752 244 788" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1214215824-3488378134)" mask="url(#d2-1214215824)" /></g><g class="KHJlc3VsdCAtJmd0OyBmaW5pc2gpWzBd"><path d="M 244 892 C 244 930 244 950 244 986" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1214215824-3488378134)" mask="url(#d2-1214215824)" /></g><g class="KGZpbmlzaCAtJmd0OyBsaW1pdClbMF0="><path d="M 244 1090 C 244 1128 244 1148 244 1184" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1214215824-3488378134)" mask="url(#d2-1214215824)" /></g><mask id="d2-121421582