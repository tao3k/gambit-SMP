ve anchors</tspan></text></g><g class="cHJpdmF0ZQ== semantic"><g class="shape" ><rect x="217" y="594" width="393" height="98" stroke="#28618A" fill="#E5F1FB" style="stroke-width:2;" /></g><text x="413.5" y="632.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="413.5" dy="0">Poll / check split or clone</tspan><tspan x="413.5" dy="17.666667">Fresh private anchor and PointId</tspan><tspan x="413.5" dy="17.666667">Copied comments do not duplicate role authority</tspan></text></g><g class="ZnJlZXpl gate"><g class="shape" ><rect x="10" y="813" width="483" height="98" stroke="#A36918" fill="#FFF1D9" style="stroke-width:2;" /></g><text x="251.5" y="851.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="251.5" dy="0">Freeze graph revision</tspan><tspan x="251.5" dy="17.666667">Exactly one compatible addressable PointId per required role</tspan><tspan x="251.5" dy="17.666667">Point purpose and RETN / RETT / RETI requirement are distinct</tspan></text></g><g class="bGF5b3V0 physical"><g class="shape" ><rect x="31" y="1011" width="441" height="98" stroke="#6A4698" fill="#EEE8FC" style="stroke-width:2;" /></g><text x="251.5" y="1049.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="251.5" dy="0">Zig common product plan</tspan><tspan x="251.5" dy="17.666667">PointId -&gt; HostId + LocalOrdinal + FrameLayout</tspan><tspan x="251.5" dy="17.666667">Numbers are physical details, not semantic role identity</tspan></text></g><g class="YmluZGluZw== runtime"><g class="shape" ><rect x="34" y="1209" width="434" height="98" stroke="#397344" fill="#E7F4E8" style="stroke-width:2;" /></g><text x="251" y="1247.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="251" dy="0">Runtime image binding</tspan><tspan x="251" dy="17.666667">Role -&gt; PointId -&gt; resolved runtime label</tspan><tspan x="251" dy="17.666667">Code and metadata retained by existing lifetime owner</tspan></text></g><g class="ZGVsZXRpb24= gate"><g class="shape" ><rect x="23" y="1407" width="457" height="114" stroke="#A36918" fill="#FFF1D9" style="stroke-width:2;" /></g><text x="251.5" y="1445.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="251.5" dy="0">Retirement gate</tspan><tspan x="251.5" dy="17.25">All old role consumers migrated and qualified</tspan><tspan x="251.5" dy="17.25">Then remove numeric binding / ordinal-prefix dependence</tspan><tspan x="251.5" dy="17.25">Preserve unrelated historical frame and masking fixes</tspan></text></g><g class="KG1hbmlmZXN0IC0mZ3Q7IGRlY2xhcmUpWzBd"><marker id="mk-d2-2578458928-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 251 100 C 251 138 251 158 251 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2578458928-3488378134)" mask="url(#d2-2578458928)" /></g><g class="KGRlY2xhcmUgLSZndDsgcHJlc2VydmUpWzBd"><path d="M 251 298 C 251 336 251 356 251 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2578458928-3488378134)" mask="url(#d2-2578458928)" /></g><g class="KHByZXNlcnZlIC0mZ3Q7IHByaXZhdGUpWzBd"><path d="M 333.207592 495.041215 C 397.100006 534 413.5 554 413.5 590" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2578458928-3488378134)" mask="url(#d2-2578458928)" /></g><g class="KHByZXNlcnZlIC0mZ3Q7IGZyZWV6ZSlbMF0="><path d="M 168.792401 495.041203 C 104.899002 534 88.5 563.799988 88.5 593.5 C 88.5 623.200012 106.300003 764.700012 174.20059 811.238607" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2