" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="581.5" dy="0">Reachability is separate</tspan><tspan x="581.5" dy="17.666667">Readiness can consume C or reject U before body</tspan><tspan x="581.5" dy="17.666667">Bit algebra is not a native scenario result</tspan></text></g><g class="c3BsaXQ="><g class="shape" ><rect x="373" y="594" width="418" height="98" stroke="#0D32B2" fill="#DFEEFF" class=" stroke-B1" style="stroke-width:2;" /></g><text x="582" y="632.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="582" dy="0">Proposed one authoritative CancelCell</tspan><tspan x="582" dy="17.666667">TraceFrame saves only legacy projection excluding K</tspan><tspan x="582" dy="17.666667">All checks / resets / private writers must migrate</tspan></text></g><g class="cmVzdG9yZQ=="><g class="shape" ><rect x="405" y="792" width="353" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="581.5" y="830.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="581.5" dy="0">Restore at the same source point</tspan><tspan x="581.5" dy="17.666667">Legacy projection = saved legacy projection</tspan><tspan x="581.5" dy="17.666667">CancelCell receives NO trace-exit mutation</tspan></text></g><g class="cHJlc2VydmU="><g class="shape" ><rect x="614" y="998" width="416" height="98" stroke="#0D32B2" fill="#E8F4E8" class=" stroke-B1" style="stroke-width:2;" /></g><text x="822" y="1036.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="822" dy="0">Preservation target</tspan><tspan x="822" dy="17.666667">Original recursion scopes, list order, code/result fold</tspan><tspan x="822" dy="17.666667">Original non-cancellation projection at restore</tspan></text></g><g class="Y2hhbmdl"><g class="shape" ><rect x="127" y="990" width="427" height="114" stroke="#0D32B2" fill="#FFF0E5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="340.5" y="1028.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="340.5" dy="0">Explicit semantic change</tspan><tspan x="340.5" dy="17.25">Old trace erasure / replay histories differ</tspan><tspan x="340.5" dy="17.25">No writable shadow; no full equivalence claim</tspan><tspan x="340.5" dy="17.25">DELETED and other legacy lifecycle effects still qualify</tspan></text></g><g class="KHNvdXJjZSAtJmd0OyBlZmZlY3QpWzBd"><marker id="mk-d2-720883950-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 581.5 100 C 581.5 138 581.5 158 581.5 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-720883950-3488378134)" mask="url(#d2-720883950)" /></g><g class="KGVmZmVjdCAtJmd0OyBxdWFsaWZ5KVswXQ=="><path d="M 581.5 298 C 581.5 336 581.5 356 581.5 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-720883950-3488378134)" mask="url(#d2-720883950)" /></g><g class="KHF1YWxpZnkgLSZndDsgc3BsaXQpWzBd"><path d="M 581.5 496 C 581.5 534 581.5 554 581.5 590" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-720883950-3488378134)" mask="url(#d2-720883950)" /></g><g class="KHNwbGl0IC0mZ3Q7IHJlc3RvcmUpWzBd"><path d="M 581.5 694 C 581.5 732 581.5 752 581.5 788" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-720883950-3488378134)" mask="url(#d2-720883950)" /></g><g class="KHJlc3RvcmUgLSZndDsgcHJlc2VydmUpWzBd"><path d="M 702.10061 890.758447 C 797.849976 930 822.25 951.599976 822.25 994" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-72