		.d2-3580906538 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="aGlzdG9yeQ=="><g class="shape" ><rect x="163" y="198" width="350" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="338" y="236.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="338" dy="0">Declared map/capture workload history</tspan><tspan x="338" dy="17.666667">retention, mutation, replay and GC triggers</tspan><tspan x="338" dy="17.666667">no assumed benchmark numbers</tspan></text></g><g class="Z2Fpbg=="><g class="shape" ><rect x="361" y="404" width="329" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="525.5" y="442.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="525.5" dy="0">Potential removed work G</tspan><tspan x="525.5" dy="17.666667">repeat mature copying</tspan><tspan x="525.5" dy="17.666667">full mature saved-graph minor traversal</tspan></text></g><g class="YWRkZWQ="><g class="shape" ><rect x="0" y="396" width="301" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="150.5" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="150.5" dy="0">Added / retained work A</tspan><tspan x="150.5" dy="17.25">promotion and early stabilization</tspan><tspan x="150.5" dy="17.25">barriers / roots / logs / access</tspan><tspan x="150.5" dy="17.25">major work / phases / restore copies</tspan></text></g><g class="Z2F0ZQ=="><g class="shape" ><rect x="189" y="610" width="298" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="338" y="648.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="338" dy="0">Time benefit condition</tspan><tspan x="338" dy="17.666667">G &gt; A</tspan><tspan x="338" dy="17.666667">robust interval: lower(G) &gt; upper(A)</tspan></text></g><g class="c2VtYW50aWNz"><g class="shape" ><rect x="179" y="808" width="319" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="338.5" y="846.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="338.5" dy="0">Semantic conditions</tspan><tspan x="338.5" dy="17.666667">all roots and writers / dynamic aliases</tspan><tspan x="338.5" dy="17.666667">multi-shot replay / wind / code lifetime</tspan></text></g><g class="Y29vcmRpbmF0ZXM="><g class="shape" ><rect x="193" y="1006" width="290" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="338" y="1044.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="338" dy="0">Separate acceptance coordinates</tspan><tspan x="338" dy="17.666667">serial time / pauses / throughput</tspan><tspan x="338" dy="17.666667">peak memory / FFI / diagnosability</tspan></text></g><g class="bGVhcm4="><g class="shape" ><rect x="158" y="0" width="360" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="338" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="338" dy="0">Learning from OCaml</tspan><tspan x="338" dy="17.666667">mechanisms, constraints and tradeoffs</tspan><tspan x="338" dy="17.666667">reflect on Gambit&#39;s own frame/control graph</tspan></text></g><g class="ZGVjaXNpb24="><g class="shape" ><rect x="130" y="1204" width="417" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="338.5" y="1242.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="338.5" dy="0">Research decision</tspan><tspan x="338.5" dy="17.666667">keep useful lazy capture and general Scheme control</tspan><tspan x="338.5" dy="17.666667">redesign where coverage or total benefit fails</tspan></text></g><g class="KGhpc3RvcnkgLSZndDsgZ2FpbilbMF0="><marker id="mk-d2-3580906538-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 432.269836 296.931493 C 506.5 336 525.5 357.600006 525.5 400" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3580906538-3488378134)" mask="url(#d2-3580906538)" /></g><g class="KGhpc3RvcnkgLSZndDsgYWRkZWQpWzBd"><path d="M 243.730164 296.931493 C 169.5 336 150.5 356 150.5 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3580906538-3488378134)" mask="url(#d2-3580906538)" /></g><g class="KGdhaW4gLSZndDsgZ2F0ZSlbMF0="><path d="M 525.5 504 C 525.5 548.400024 506.5 570 434.039673 608.137014" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3580906538-3488378134)" mask="url(#d2-3580906538)" /></g><g class="KGFkZGVkIC0mZ3Q7IGdhdGUpWzBd"><path d="M 150.5 512 C 150.5 550 169.5 570 241.960327 608.137014" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3580906538-3488378134)" mask="url(#d2-3580906538)" /></g><g class="KGdhdGUgLSZndDsgc2VtYW50aWNzKVswXQ=="><path d="M 338 710 C 338 748 338 768 338 804" stroke="#0