		.d2-3272970011 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="cmVnaXN0cmF0aW9u semantic"><g class="shape" ><rect x="358" y="0" width="444" height="98" stroke="#0D32B2" fill="#e4f0ff" class=" stroke-B1" style="stroke-width:2;" /></g><text x="580" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="580" dy="0">Independent issuer / registration</tspan><tspan x="580" dy="17.666667">Tcl command, native function export, foreign destructor</tspan><tspan x="580" dy="17.666667">Registration retains a future invocation right</tspan></text></g><g class="bG9va3Vw native"><g class="shape" ><rect x="144" y="198" width="384" height="98" stroke="#0D32B2" fill="#e8f5e5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="336" y="236.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="336" dy="0">Protected identity resolution</tspan><tspan x="336" dy="17.666667">Directory reader -&gt; validate -&gt; acquire use</tspan><tspan x="336" dy="17.666667">No dereference-before-pin or identity-reuse gap</tspan></text></g><g class="dXNl native"><g class="shape" ><rect x="142" y="396" width="388" height="98" stroke="#0D32B2" fill="#e8f5e5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="336" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="336" dy="0">Actual target-specific uses</tspan><tspan x="336" dy="17.666667">Invocation / native return / continuation</tspan><tspan x="336" dy="17.666667">Map decoder / finalizer / queue or library borrow</tspan></text></g><g class="dHJhbnNmZXI= native"><g class="shape" ><rect x="0" y="615" width="423" height="98" stroke="#0D32B2" fill="#e8f5e5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="211.5" y="653.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="211.5" dy="0">Derived use transfer</tspan><tspan x="211.5" dy="17.666667">Issue child while parent still held</tspan><tspan x="211.5" dy="17.666667">Keep only the resources the child actually depends on</tspan></text></g><g class="Y2xvc2U= semantic"><g class="shape" ><rect x="605" y="396" width="408" height="98" stroke="#0D32B2" fill="#e4f0ff" class=" stroke-B1" style="stroke-width:2;" /></g><text x="809" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="809" dy="0">Close independent issuance and public resolution</tspan><tspan x="809" dy="17.666667">Tombstone directory; revoke external registrations</tspan><tspan x="809" dy="17.666667">Unknown raw-pointer issuers prevent early reclaim</tspan></text></g><g class="ZHJhaW4= native"><g class="shape" ><rect x="530" y="615" width="435" height="98" stroke="#0D32B2" fill="#e8f5e5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="747.5" y="653.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="747.5" dy="0">Drain relevant uses and protected readers</tspan><tspan x="747.5" dy="17.666667">Pending callback, destructor and scanner all accounted</tspan><tspan x="747.5" dy="17.666667">Unrelated VM users need not finish</tspan></text></g><g class="ZnJlZQ== native"><g class="shape" ><rect x="554" y="813" width="387" height="98" stroke="#0D32B2" fill="#e8f5e5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="747.5" y="851.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="747.5" dy="0">Free closed target after uses and readers drain</tspan><tspan x="747.5" dy="17.666667">Provider / OS release follows runtime last-use</tspan><tspan x="747.5" dy="17.666667">Failure or dependency cycle retains safe custody</tspan></text></g><g class="bGltaXQ= limit"><g class="shape" ><rect x="523" y="1011" width="448" height="98" stroke="#0D32B2" fill="#fff0cf" class=" stroke-B1" style="stroke-width:2;" /></g><text x="747" y="1049.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="747" dy="0">Conditional PT05 refinement</tspan><tspan x="747" dy="17.666667">Local normal paths traced; external ABI closure open</tspan><tspan x="747" dy="17.666667">Refcount, join and provider remove are insufficient alone</tspan></text></g><g class="KHJlZ2lzdHJhdGlvbiAtJmd0OyBsb29rdXApWzBd"><marker id="mk-d2-3272970011-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 456.647231 98.753158 C 360.100006 138 335.5 158 335.5 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3272970011-3488378134)" mask="url(#d2-3272970011)" /></g><g class="KGxvb2t1cCAtJmd0OyB1c2UpWzBd"><path d="M 335.5 298 C 335.5 336 335.5 356 335.5 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3272970011-3488378134)" mask="url(#d2-3272970011)" /></g><g class="KHVzZSAtJmd0OyB0cmFuc2ZlcilbMF0="><path d="M 335.5 495.5 C 335.5 542.299988 321.899994 566.700012 270.477527 612.828983" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3272970011-3488378134)" mask="url(#d2-3272970011)" /></g><g class="KHRyYW5zZmVyIC0mZ3Q7IHVzZSlbMF0="><marker id="mk-d2-3272970011-2177206569" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnit