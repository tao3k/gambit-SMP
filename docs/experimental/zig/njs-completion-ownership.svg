		.d2-780944386 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="aW5wdXQ="><g class="shape" ><rect x="531" y="0" width="332" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="697" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="697" dy="0">One admitted execution plan</tspan><tspan x="697" dy="17.25">Q stdout capture + inherited stderr/stdin</tspan><tspan x="697" dy="17.25">B inherited stdio</tspan><tspan x="697" dy="17.25">Same policy under Scheme / C / Zig</tspan></text></g><g class="Y29udHJvbGxlcg=="><g class="shape" ><rect x="485" y="214" width="424" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="697" y="252.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="697" dy="0">Stable job owner + generation</tspan><tspan x="697" dy="17.666667">Acquired resources / child custody / observation state</tspan><tspan x="697" dy="17.666667">No independent native reaper in Gambit process</tspan></text></g><g class="dGVybWluYWw="><g class="shape" ><rect x="965" y="420" width="275" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1102.5" y="458.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1102.5" dy="0">Terminal axis</tspan><tspan x="1102.5" dy="17.666667">Launch failure or tool exit/signal</tspan><tspan x="1102.5" dy="17.666667">One designated status owner</tspan></text></g><g class="Ynl0ZXM="><g class="shape" ><rect x="488" y="412" width="417" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="696.5" y="450.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="696.5" dy="0">Observation axis</tspan><tspan x="696.5" dy="17.25">Q bounded BS1: used &lt;= L; separate nonempty probe</tspan><tspan x="696.5" dy="17.25">EOF / error / overflow kept distinct</tspan><tspan x="696.5" dy="17.25">B requires no query buffer</tspan></text></g><g class="Y2xvc2U="><g class="shape" ><rect x="0" y="412" width="428" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="214" y="450.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="214" dy="0">Lifetime axis</tspan><tspan x="214" dy="17.25">Streams/handles closing is not callback quiescence</tspan><tspan x="214" dy="17.25">Keep control and byte storage until no future access</tspan><tspan x="214" dy="17.25">Scope cleanup alone cannot release an escaped owner</tspan></text></g><g class="am9pbg=="><g class="shape" ><rect x="456" y="626" width="481" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="696.5" y="664.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="696.5" dy="0">Result eligibility + resource retirement</tspan><tspan x="696.5" dy="17.25">Correct terminal state and complete admitted observation</tspan><tspan x="696.5" dy="17.25">No partial flags / premature free / worker-exit-as-tool-success</tspan><tspan x="696.5" dy="17.25">Unknown or pending custody remains explicit</tspan></text></g><g class="ZGVsaXZlcnk="><g class="shape" ><rect x="475" y="840" width="444" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="697" y="878.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="697" dy="0">Decode / result construction / delivery axis</tspan><tspan x="697" dy="17.25">Fallible work keeps backing owners guarded</tspan><tspan x="697" dy="17.25">Accepted transfer or acknowledged release</tspan><tspan x="697" dy="17.25">Scheme exceptions / continuation need controller policy</tspan></text></g><g class="Z2F0ZQ=="><g class="shape" ><rect x="499" y="1054" width="396" height="114" stroke="#0D32B2" fill="#fff0ce" class=" stroke-B1" style="stroke-width:2;" /></g><text x="697" y="1092.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="697" dy="0">FT01-FT10 qualification remains open</tspan><tspan x="697" dy="17.25">No tree-cancellation or bounded-cleanup promise</tspan><tspan x="697" dy="17.25">Byte bound is not a time bound</tspan><tspan x="697" dy="17.25">Design only: no implementation or native test</tspan></text></g><g class="KGlucHV0IC0mZ3Q7IGNvbnRyb2xsZXIpWzBd"><marker id="mk-d2-780944386-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 696.5 116 C 696.5 154 696.5 174 696.5 210" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-780944386-3488378134)" mask="url(#d2-780944386)" /></g><g class="KGNvbnRyb2xsZXIgLSZndDsgdGVybWluYWwpWzBd"><path d="M 899.443041 312.473912 C 1061.5 352 1102.5 373.600006 1102.5 416" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-780944386-3488378134)" mask="url(#d2-780944386)" /></g><g class="KGNvbnRyb2xsZXIgLSZndDsgYnl0ZXMpWzBd"><path d="M 696.5 314 C 696.5 352 696.5 372 696.5 408" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="st