neric GC execution inside arbitrary lock wait</tspan></text></g><g class="cHJlcGFyZQ=="><g class="shape" ><rect x="0" y="411" width="443" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="221.5" y="449.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="221.5" dy="0">BW2 future preparation</tspan><tspan x="221.5" dy="17.25">Native input copies + complete saved roots</tspan><tspan x="221.5" dy="17.25">Root carrier remains live and independently enumerable</tspan><tspan x="221.5" dy="17.25">Request/member transition must be acknowledged</tspan></text></g><g class="bmF0aXZl"><g class="shape" ><rect x="179" y="646" width="357" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="357.5" y="684.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="357.5" dy="0">Native-only phase</tspan><tspan x="357.5" dy="17.25">No Scheme data access or callbacks</tspan><tspan x="357.5" dy="17.25">Reserve original processor/return origin</tspan><tspan x="357.5" dy="17.25">Not permission for another host to mutate it</tspan></text></g><g class="cmVlbnRyeQ=="><g class="shape" ><rect x="126" y="860" width="463" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="357.5" y="898.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="357.5" dy="0">Reentry pending</tspan><tspan x="357.5" dy="17.25">Validate live VM and coherent processor/member authority</tspan><tspan x="357.5" dy="17.25">Service pending operations at legal safepoint</tspan><tspan x="357.5" dy="17.25">Reload roots/state; then allocating result conversion</tspan></text></g><g class="ZG9uZQ=="><g class="shape" ><rect x="422" y="1074" width="382" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="613" y="1112.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="613" dy="0">Owned return or explicit failed-reentry custody</tspan><tspan x="613" dy="17.666667">Native cleanup survives errors/nonlocal control</tspan><tspan x="613" dy="17.666667">No cached VM pointer reuse or automatic retry</tspan></text></g><g class="Z2F0ZQ=="><g class="shape" ><rect x="275" y="1272" width="403" height="98" stroke="#0D32B2" fill="#fff0ce" class=" stroke-B1" style="stroke-width:2;" /></g><text x="476.5" y="1310.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="476.5" dy="0">BW2 remains unimplemented / unresolved</tspan><tspan x="476.5" dy="17.666667">No processor-count decrement or unlock shortcut</tspan><tspan x="476.5" dy="17.666667">Existing BW1 mechanisms retained; no native tests</tspan></text></g><g class="KGFjdGl2ZSAtJmd0OyBtb2RlKVswXQ=="><marker id="mk-d2-3648339052-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 476.75 100 C 476.75 138 476.799988 158 476.979999 194.00005" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3648339052-3488378134)" mask="url(#d2-3648339052)" /></g><g class="KG1vZGUgLSZndDsgYncxKVswXQ=="><path d="M 575.928882 270.528596 C 809 334.399994 867.75 374 867.75 409.25 C 867.75 444.5 867.75 491.5 867.75 526.75 C 867.75 562 867.75 609 867.75 644.25 C 867.75 679.5 867.75 820 867.75 856" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3648339052-3488378134)" mask="url(#d2-3648339052)" /><text x="868" y="465" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">supported existing scope</text></g><g class="KG1vZGU