		.d2-2127771010 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="dGl0bGU="><g class="shape" ></g><text x="178.5" y="47" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="178.5" dy="0">SAME COMMAND, INDEPENDENT TRACE RECORDS</tspan><tspan x="178.5" dy="18.5">Public-source construction; fixed direct-enter domain</tspan></text></g><g class="cmVnaXN0ZXI="><g class="shape" ><rect x="417" y="0" width="383" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="608.5" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="608.5" dy="0">Public adds create separate records</tspan><tspan x="608.5" dy="17.666667">f list: A then B; both callbacks call f once</tspan><tspan x="608.5" dy="17.666667">No cancellation, mutation, limits or extra traces</tspan></text></g><g class="YQ=="><g class="shape" ><rect x="451" y="198" width="316" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="609" y="236.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="609" dy="0">Outer f enters A</tspan><tspan x="609" dy="17.666667">A busy; I suppresses interpreter traces</tspan><tspan x="609" dy="17.666667">A calls f again</tspan></text></g><g class="Yg=="><g class="shape" ><rect x="483" y="396" width="252" height="98" stroke="#0D32B2" fill="#DFEEFF" class=" stroke-B1" style="stroke-width:2;" /></g><text x="609" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="609" dy="0">Nested direct scan on SAME f</tspan><tspan x="609" dy="17.666667">Skip busy A; idle B still enters</tspan><tspan x="609" dy="17.666667">B becomes busy and calls f</tspan></text></g><g class="Ym90aA=="><g class="shape" ><rect x="453" y="594" width="311" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="608.5" y="632.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="608.5" dy="0">Deeper f skips A and B callback bodies</tspan><tspan x="608.5" dy="17.666667">Both records busy; f body still runs</tspan><tspan x="608.5" dy="17.666667">Return B, nested f, then A</tspan></text></g><g class="c2Vjb25k"><g class="shape" ><rect x="430" y="792" width="358" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="609" y="830.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="609" dy="0">Outer scan now reaches B</tspan><tspan x="609" dy="17.666667">A is idle again; B calls f</tspan><tspan x="609" dy="17.666667">Nested A executes and calls f with both busy</tspan></text></g><g class="ZG9uZQ=="><g class="shape" ><rect x="441" y="990" width="335" height="98" stroke="#0D32B2" fill="#E8F4E8" class=" stroke-B1" style="stroke-width:2;" /></g><text x="608.5" y="1028.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="608.5" dy="0">Source-matched result for two records</tspan><tspan x="608.5" dy="17.666667">4 trace callback bodies; 5 f bodies</tspan><tspan x="608.5" dy="17.666667">Maximum 2 simultaneous trace callbacks</tspan></text></g><g class="Ym91bmRhcnk="><g class="shape" ><rect x="379" y="1188" width="459" height="114" stroke="#0D32B2" fill="#FFF0E5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="608.5" y="1226.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="608.5" dy="0">General fixed-r recurrence</tspan><tspan x="608.5" dy="17.25">T(0)=0; T(k)=k*(1+T(k-1))</tspan><tspan x="608.5" dy="17.25">Changing to name-wide suppression changes observations</tspan><tspan x="608.5" dy="17.25">Counts derived by hand; no native run</tspan></text></g><g class="KHJlZ2lzdGVyIC0mZ3Q7IGEpWzBd"><marker id="mk-d2-2127771010-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 608.5 100 C 608.5 138 608.5 158 608.5 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2127771010-3488378134)" mask="url(#d2-2127771010)" /></g><g class="KGEgLSZndDsgYilbMF0="><path d="M 608.5 298 C 608.5 336 608.5 356 608.5 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2127771010-3488378134)" mask="url(#d2-2127771010)" /></g><g class="KGIgLSZndDsgYm90aClbMF0="><path d="M 608.5 496 C 608.5 534 608.5 554 608.5 590" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2127771010-3488378134)" mask="url(#d2-2127771010)" /></g><g class="KGJvdGggLSZndDsgc2Vjb25kKVswXQ=="><path d="M 608.5 694 C 608.5 732 608.5 752 608.5 788" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2127771010-3488378134)" mask="url(#d2-2127771010)" /></g><g class="KHNlY29uZCAtJmd0OyBkb25lKVswXQ=="><path d="M 608.5 892 C 608.5 930 608.5 950 608.5 986" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2127771010-3488378134)" mask="url(#d2-2127771010)" /></g><g class="KGRvbmUgLSZndDsgYm91bmRhcnkpWzBd"><path d="M 608.5 1090 C 608.5 1128 608.5 1148 608.5 1184" stroke="#0D32B2