span x="620.5" dy="17.25">qualified store / publication</tspan></text></g><g class="YWN0aXZl"><g class="shape" ><rect x="451" y="610" width="338" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="620" y="648.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="620" dy="0">Active dirty/root/capture producer epoch</tspan><tspan x="620" dy="18.5">source storage remains retained</tspan></text></g><g class="Y3V0"><g class="shape" ><rect x="453" y="792" width="335" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="620.5" y="830.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="620.5" dy="0">Freeze and acknowledge collection cut</tspan><tspan x="620.5" dy="18.5">all actual producers and relevant readers</tspan></text></g><g class="ZHJhaW4="><g class="shape" ><rect x="443" y="974" width="374" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="630" y="1012.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="630" dy="0">Drain frozen sources and root/capture work</tspan><tspan x="630" dy="17.666667">trace/fix all young references</tspan><tspan x="630" dy="17.666667">account in-flight workers and publication debt</tspan></text></g><g class="Y2xvc2U="><g class="shape" ><rect x="472" y="1172" width="317" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="630.5" y="1210.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="630.5" dy="0">Closure before storage reuse</tspan><tspan x="630.5" dy="17.666667">settle source leases / root withdrawals</tspan><tspan x="630.5" dy="17.666667">reset only the completed epoch</tspan></text></g><g class="bmV4dA=="><g class="shape" ><rect x="