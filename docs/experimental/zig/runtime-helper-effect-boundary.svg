		.d2-3204309556 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="Y29udHJhY3Q= native"><g class="shape" ><rect x="644" y="0" width="422" height="114" stroke="#6A4698" fill="#EEE8FC" style="stroke-width:2;" /></g><text x="855" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="855" dy="0">RuntimeHelperContract</tspan><tspan x="855" dy="17.25">GC / heap movement / stack rebase / reentry</tspan><tspan x="855" dy="17.25">Collective / blocking / native allocation / nonlocal exit</tspan><tspan x="855" dy="17.25">Source/profile closure and root/reload obligations</tspan></text></g><g class="c2VjdGlvbg== runtime"><g class="shape" ><rect x="1305" y="214" width="392" height="98" stroke="#397344" fill="#E7F4E8" style="stroke-width:2;" /></g><text x="1501" y="252.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1501" dy="0">heap_limit / stack_limit / stack-overflow undo</tspan><tspan x="1501" dy="17.666667">Section, fp/hp, limits and frame state can change</tspan><tspan x="1501" dy="17.666667">No direct GC call is not a transitive leaf guarantee</tspan></text></g><g class="Y29sbGVjdGl2ZQ== runtime"><g class="shape" ><rect x="902" y="214" width="343" height="98" stroke="#397344" fill="#E7F4E8" style="stroke-width:2;" /></g><text x="1073.5" y="252.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1073.5" dy="0">garbage_collect / service_sync_op</tspan><tspan x="1073.5" dy="17.666667">OP_NOOP can join a winning GC or resize</tspan><tspan x="1073.5" dy="17.666667">Processor-zero error can throw nonlocally</tspan></text></g><g class="Y2FsbGJhY2s= runtime"><g class="shape" ><rect x="432" y="214" width="410" height="98" stroke="#397344" fill="#E7F4E8" style="stroke-width:2;" /></g><text x="637" y="252.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="637" dy="0">service_interrupts_pstate</tspan><tspan x="637" dy="17.666667">Registered execute_fn callback effects need closure</tspan><tspan x="637" dy="17.666667">Status-return API does not imply no reentry / no GC</tspan></text></g><g class="Zm9yZWlnbg== runtime"><g class="shape" ><rect x="0" y="214" width="372" height="98" stroke="#397344" fill="#E7F4E8" style="stroke-width:2;" /></g><text x="186" y="252.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="186" dy="0">SFUN marker / throw_error</tspan><tspan x="186" dy="17.666667">Allocating marker with retained rooting TODO</tspan><tspan x="186" dy="17.666667">Matching catcher, roots and unwind lifetime</tspan></text></g><g class="YWRtaXNzaW9u gate"><g class="shape" ><rect x="614" y="412" width="482" height="114" stroke="#A36918" fill="#FFF1D9" style="stroke-width:2;" /></g><text x="855" y="450.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="855" dy="0">MLIR/LLVM lowering admission</tspan><tspan x="855" dy="17.25">Explicit exceptional successors and moved-value reloads</tspan><tspan x="855" dy="17.25">Unknown effects remain barriers</tspan><tspan x="855" dy="17.25">Memory effects alone do not model Scheme continuation laws</tspan></text></g><g class="KGNvbnRyYWN0IC0mZ3Q7IHNlY3Rpb24pWzBd"><marker id="mk-d2-3204309556-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><pat