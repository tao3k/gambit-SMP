e in C and Zig</tspan></text></g><g class="c3RhdHVz"><g class="shape" ><path d="M 448 686 C 446 686 444 686 442 686 L 136 641 C 133 641 133 640 136 639 L 442 594 C 445 594 450 594 453 594 L 759 639 C 762 639 762 640 759 641 L 454 686 C 452 686 450 686 448 686 Z" stroke="#0D32B2" fill="#CFD2DD" class=" stroke-B1 fill-N4" style="stroke-width:2;" /></g><text x="448" y="645.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Inspect status and validate postconditions</text></g><g class="ZmFpbHVyZQ=="><g class="shape" ><rect x="496" y="807" width="363" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="677.5" y="845.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="677.5" dy="0">Failure</tspan><tspan x="677.5" dy="17.25">Preserve bounded diagnostic / fallback</tspan><tspan x="677.5" dy="17.25">Dispose produced output buffer and message</tspan><tspan x="677.5" dy="17.25">No unchanged-module or implicit-retry claim</tspan></text></g><g class="c3VjY2Vzcw=="><g class="shape" ><rect x="0" y="807" width="436" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="218" y="845.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="218" dy="0">Success</tspan><tspan x="218" dy="17.25">Transfer accepted buffer to artifact owner</tspan><tspan x="218" dy="17.25">Dispose message and nontransferred request resources</tspan><tspan x="218" dy="17.25">Runtime publication/lifetime remains separate</tspan></text></g><g class="cmVzdWx0"><g class="shape" ><rect x="198" y="1021" width="500" height="98" stroke="#0D32B2" fill="#fff0ce" class=" stroke-B1" style="stroke-width:2;" /></g><text x="448" y="1059.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="448" dy="0">Normalized artifact or diagnostic</tspan><tspan x="448" dy="17.666667">C cleanup or Zig scope syntax expresses the same ownership law</tspan><tspan x="448" dy="17.666667">No resource-law retirement or native qualification</tspan></text></g><g class="KG93bmVkIC0mZ3Q7IGNhbGwpWzBd"><marker id="mk-d2-2001068344-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 447.75 100 C 447.75 138 447.75 158 447.75 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2001068344-3488378134)" mask="url(#d2-2001068344)" /></g><g class="KGNhbGwgLSZndDsgYWRvcHQpWzBd"><path d="M 447.75 298 C 447.75 336 447.75 356 447.75 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2001068344-3488378134)" mask="url(#d2-2001068344)" /></g><g class="KGFkb3B0IC0mZ3Q7IHN0YXR1cylbMF0="><path d="M 447.75 496 C 447.75 534 447.799988 554 447.979999 590.00005" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2001068344-3488378134)" mask="url(#d2-2001068344)" /></g><g class="KHN0YXR1cyAtJmd0OyBmYWlsdXJlKVswXQ=="><path d="M 526.815396 676.839249 C 647 732.400024 677.5 758.700012 677.5 803.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2001068344-3488378134)" mask="url(#d2-2001068344)" /><text x="626.5" y="728" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">failure / rejected result</text></g><g class="KHN0YXR1cyAtJmd0OyBzdWNjZXNzKVswXQ=="><path d="M 369.188088 675.846743 C 248.600006 732.200012 218 758.700012 218 803.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2001068344-3488378134)" mask="url(#d2-2001068344)" /><text x="269" y="728" fill="#676C