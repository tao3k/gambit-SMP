		.d2-2914340089 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="dGl0bGU="><g class="shape" ></g><text x="237" y="47" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="237" dy="0">NESTED TRACE SUPPRESSION</tspan><tspan x="237" dy="18.5">Exact source scopes; design research only</tspan></text></g><g class="YQ=="><g class="shape" ><rect x="436" y="0" width="304" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="588" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="588" dy="0">Outer TraceExecutionProc A</tspan><tspan x="588" dy="17.666667">Save legacy projection with prior I=0</tspan><tspan x="588" dy="17.666667">At source boundary: I=1, A busy</tspan></text></g><g class="cm91dGVz"><g class="shape" ><rect x="423" y="198" width="329" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="587.5" y="236.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Callback script invokes more commands</text></g><g class="c2tpcEE="><g class="shape" ><rect x="800" y="364" width="331" height="98" stroke="#0D32B2" fill="#FFF0E5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="965.5" y="402.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="965.5" dy="0">Same active record A</tspan><tspan x="965.5" dy="17.666667">Per-record busy test skips callback body</tspan><tspan x="965.5" dy="17.666667">Not a global trace-off rule</tspan></text></g><g class="c2tpcEk="><g class="shape" ><rect x="435" y="364" width="305" height="98" stroke="#0D32B2" fill="#FFF0E5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="587.5" y="402.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="587.5" dy="0">Interpreter-wide / step dispatch</tspan><tspan x="587.5" dy="17.666667">TclCheckInterpTraces sees I=1</tspan><tspan x="587.5" dy="17.666667">Dispatch suppressed for this interval</tspan></text></g><g class="Yg=="><g class="shape" ><rect x="61" y="364" width="314" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="218" y="402.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="218" dy="0">Different command direct trace B</tspan><tspan x="218" dy="17.666667">Direct loop has no interpreter I check</tspan><tspan x="218" dy="17.666667">B may enter; saves I=1 and sets B busy</tspan></text></g><g class="bXV0YXRpb24="><g class="shape" ><rect x="7" y="562" width="422" height="98" stroke="#0D32B2" fill="#DFEEFF" class=" stroke-B1" style="stroke-width:2;" /></g><text x="218" y="600.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="218" dy="0">Admitted cancellation operation</tspan><tspan x="218" dy="17.666667">Install / consume / owned reset changes CancelCell</tspan><tspan x="218" dy="17.666667">Trace snapshots have no cancellation write authority</tspan></text></g><g class="ZXhpdEI="><g class="shape" ><rect x="59" y="760" width="319" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="218.5" y="798.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="218.5" dy="0">B restores its saved legacy projection</tspan><tspan x="218.5" dy="17.666667">I remains 1 while A is active</tspan><tspan x="218.5" dy="17.666667">CancelCell is untouched by this restore</tspan></text></g><g class="ZXhpdEE="><g class="shape" ><rect x="0" y="958" width="436" height="98" stroke="#0D32B2" fill="#E8F4E8" class=" stroke-B1" style="stroke-width:2;" /></g><text x="218" y="996.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="218" dy="0">A later restores its prior legacy projection</tspan><tspan x="218" dy="17.666667">I returns to 0 at the original source point</tspan><tspan x="218" dy="17.666667">Other admitted cleanup and actual return still required</tspan></text></g><g class="KGEgLSZndDsgcm91dGVzKVswXQ=="><marker id="mk-d2-2914340089-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 587.5 100 C 587.5 138 587.5 158 587.5 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2914340089-3488378134)" mask="url(#d2-2914340089)" /></g><g class="KHJvdXRlcyAtJmd0OyBza2lwQSlbMF0="><path d="M 739.453576 264.428416 C 919.900024 304 965.5 324 965.5 360" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2914340089-3488378134)" mask="url(#d2-2914340089)" /></g><g class="KHJvdXRlcyAtJmd0OyBza2lwSSlbMF0="><path d="M 587.5 266 C 587.5 304 587.5 324 587.5 360" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2914340089-3488378134)" mask="url(#d2-2914340089)" /></g><g class="KHJvdXRlcyAtJmd0OyBiKVswXQ=="><path d="M 439.048453 264.437567 C 262.600006 304 218 324 218 360" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2914340089-3488378134)" mask="url(#d2-2914340089)" /></g><g class="KGIgLSZndDsgbXV0YXRpb24pWzBd"><path d="M 218