g><text x="683" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="683" dy="0">Trace invocation scope</tspan><tspan x="683" dy="17.666667">Preparation -&gt; original suppression set point</tspan><tspan x="683" dy="17.666667">Owns callback evaluation as a child</tspan></text></g><g class="Y2hpbGQ="><g class="shape" ><rect x="459" y="594" width="448" height="98" stroke="#0D32B2" fill="#FFF0E5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="683" y="632.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="683" dy="0">Callback evaluation finishes locally</tspan><tspan x="683" dy="17.666667">Retain target-wide cancellation custody in control ledger</tspan><tspan x="683" dy="17.666667">Do not wait for ancestor or publish target neutrality</tspan></text></g><g class="cmVzdG9yZQ=="><g class="shape" ><rect x="493" y="792" width="380" height="114" stroke="#0D32B2" fill="#DFEEFF" class=" stroke-B1" style="stroke-width:2;" /></g><text x="683" y="830.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="683" dy="0">Trace source-point restore</tspan><tspan x="683" dy="17.25">SourceSnapshot: record true cancellation write</tspan><tspan x="683" dy="17.25">SeparatedCancellation: restore legacy only</tspan><tspan x="683" dy="17.25">No implicit guard reset or added async poll</tspan></text></g><g class="bG9jYWw="><g class="shape" ><rect x="497" y="1006" width="373" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="683.5" y="1044.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="683.5" dy="0">Remaining trace cleanup -&gt; actual trace return</tspan><tspan x="683.5" dy="18.5">Step records / DString / final references</tspan></text></g><g class="b3V0ZXI="><g class="shape" ><rect x="473" y="1188" width="420" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="683" y="1226.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="683" dy="0">Invoker finishes cursor / record / result-state cleanup</tspan><tspan x="683" dy="18.5">Actual dispatcher return witnessed by caller</tspan></text></g><g class="cmVjZWlwdA=="><g class="shape" ><rect x="493" y="1370" width="380" height="98" stroke="#0D32B2" fill="#DFEEFF" class=" stroke-B1" style="stroke-width:2;" /></g><text x="683" y="1408.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="683" dy="0">TraceDispatchClosureReceipt</tspan><tspan x="683" dy="17.666667">Release this dependency only</tspan><tspan x="683" dy="17.666667">No parent-completion or native-image shortcut</tspan></text></g><g class="ZmluYWw="><g class="shape" ><rect x="450" y="1568" width="466" height="98" stroke="#0D32B2" fill="#E8F4E8" class=" stroke-B1" style="stroke-width:2;" /></g><text x="683" y="1606.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="683" dy="0">Parent actually completes; final guard revalidates</tspan><tspan x="683" dy="17.666667">All trace / native / raw / installer / resource obligations</tspan><tspan x="683" dy="17.666667">Only then selected owned reset and next-epoch publication</tspan></text></g><g class="KHBhcmVudCAtJmd0OyBkaXNwYXRjaGVyKVswXQ=="><marker id="mk-d2-1425891604-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 683 100 C 683 138 683 158 683 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1425891604-3488378134)" mask="url(#d2-1425891604)" /></g><g class="KGRpc3BhdGNoZXIgLSZndDsgdHJhY2UpWzBd"><path d="M 683 298 C 683 336 