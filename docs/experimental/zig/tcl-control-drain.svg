idth="312" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="531" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="531" dy="0">Owner observes quiescence</tspan><tspan x="531" dy="17.666667">nested scopes returned</tspan><tspan x="531" dy="17.666667">cancel/reset and deliveries reconciled</tspan></text></g><g class="ZHJhaW4="><g class="shape" ><rect x="340" y="594" width="383" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="531.5" y="632.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="531.5" dy="0">Drain remaining custody</tspan><tspan x="531.5" dy="17.666667">outcomes / background errors / command grace</tspan><tspan x="531.5" dy="17.666667">root scanners / result bytes / image returns</tspan></text></g><g class="cmV0aXJl"><g class="shape" ><rect x="379" y="792" width="305" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="531.5" y="830.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="531.5" dy="0">Retire interpreter / runtime / module</tspan><tspan x="531.5" dy="18.5">only after each dependency receipt</tspan></text></g><g class="c3R1Y2s="><g class="shape" ><rect x="0" y="396" width="315" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="157.5" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="157.5" dy="0">Unknown non-return / forbidden jump</tspan><tspan x="157.5" dy="17.666667">retain owned state; report incomplete</tspan><tspan x="157.5" dy="17.666667">no fabricated drain or thread kill</tspan></text></g><g class="KGNsb3NlIC0mZ3Q7IGNvbXBsZXRlKVswXQ=="><marker id="mk-d2-3430571053-3488378134" markerWidth="10" markerHeight="12"