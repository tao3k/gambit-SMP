/></g><text x="661.5" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="661.5" dy="0">Activate from current caller depth b</tspan><tspan x="661.5" dy="17.666667">n := b + a; active aux := b</tspan><tspan x="661.5" dy="17.666667">Bind caller ExecEnv + restoration callback</tspan></text></g><g class="eWllbGQ="><g class="shape" ><rect x="316" y="594" width="337" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="484.5" y="632.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="484.5" dy="0">Successful yield after net signed change s</tspan><tspan x="484.5" dy="17.666667">n := b; suspended aux := a + s</tspan><tspan x="484.5" dy="17.666667">Retain coroutine and its root debt</tspan></text></g><g class="dGVybWluYWw="><g class="shape" ><rect x="713" y="594" width="290" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="858" y="632.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="858" dy="0">Terminal root NRCommand retires</tspan><tspan x="858" dy="17.666667">Balanced root reaches n = b - 1</tspan><tspan x="858" dy="17.666667">Async / cleanup can still execute</tspan></text></g><g class="ZXhpdA=="><g class="shape" ><rect x="949" y="800" width="411" height="98" stroke="#0D32B2" fill="#DFEEFF" class=" stroke-B1" style="stroke-width:2;" /></g><text x="1154.5" y="838.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1154.5" dy="0">Terminal cleanup -&gt; caller environment restore</tspan><tspan x="1154.5" dy="17.666667">Compensate +1; n = b</tspan><tspan x="1154.5" dy="17.666667">In-flight exit / caller callback still need actual return</tspan></text></g><g class="b3JkaW5hcnk="><g class="shape" ><rect x="474" y="800" width="415" height="98" stroke="#0D32B2" fill="#E8F4E8" class=" stroke-B1" style="stroke-width:2;" /></g><text x="681.5" y="838.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="681.5" dy="0">Ordinary nested command beneath trace h</tspan><tspan x="681.5" dy="17.666667">b &gt;= h + 1, so b - 1 &gt;= h</tspan><tspan x="681.5" dy="17.666667">Only under balanced lease / offset / pairing premises</tspan></text></g><g class="cmV3aW5k"><g class="shape" ><rect x="0" y="792" width="414" height="114" stroke="#0D32B2" fill="#FFF0E5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="207" y="830.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="207" dy="0">Direct DeleteCoroutine -&gt; RewindCoroutine</tspan><tspan x="207" dy="17.25">Schedules activation WITHOUT command increment</tspan><tspan x="207" dy="17.25">Idle root-yield example: b=0, a=0</tspan><tspan x="207" dy="17.25">0 -&gt; -1 -&gt; 0 is a conditional source path</tspan></text></g><g class="KHJlc2VydmUgLSZndDsgY3JlYXRlKVswXQ=="><marker id="mk-d2-4131775142-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 661.5 100 C 661.5 138 661.5 158 661.5 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4131775142-3488378134)" mask="url(#d2-4131775142)" /></g><g class="KGNyZWF0ZSAtJmd0OyByZXN1bWUpWzBd"><path d="M 661.5 298 C 661.5 336 661.5 356 661.5 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4131775142-3488378134)" mask="url(#d2-4131775142)" /></g><g class="KHJlc3VtZSAtJmd0OyB5aWVsZClbMF0="><path d="M 692.278992 495.714986 C 715.25 534 697.450012 554 605.937707 592.450543" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-