xt x="522" y="732.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="522" dy="0">Independent obligations</tspan><tspan x="522" dy="17.25">root completeness / writer closure</tspan><tspan x="522" dy="17.25">atomic ordering / continuation / native effects</tspan><tspan x="522" dy="17.25">not proved by generated state tables</tspan></text></g><g class="bGVhdmVz"><g class="shape" ><rect x="341" y="908" width="362" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="522" y="946.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="522" dy="0">Retained native C assets</tspan><tspan x="522" dy="17.666667">RC storage / string and TLS cleanup</tspan><tspan x="522" dy="17.666667">pthread / close / readiness / admitted control</tspan></text></g><g class="cG9saWNpZXMucm9vdHM="><g class="shape" ><rect x="720" y="446" width="271" height="98" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="855.5" y="484.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="855.5" dy="0">RootRegistry</tspan><tspan x="855.5" dy="17.666667">stable cells / snapshot / transfer</tspan><tspan x="855.5" dy="17.666667">unlink waits for actual readers</tspan></text></g><g class="cG9saWNpZXMubG9n"><g class="shape" ><rect x="383" y="446" width="277" height="98" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="521.5" y="484.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="521.5" dy="0">BarrierLog</tspan><tspan x="521.5" dy="17.666667">bounded reserve / no-GC commit</tspan><tspan x="521.5" dy="17.666667">epoch cut / drain / reset</tspan></text></g><g class="cG9saWNpZXMucmVsZWFzZQ=="><g class="shape" ><rect x="40" y="446" width="283" height="98" stroke="#0D32B2" fill="#EDF0FD" class=" 