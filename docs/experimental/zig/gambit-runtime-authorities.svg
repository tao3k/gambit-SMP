ract</tspan><tspan x="502" dy="17.25">Root scope/store/load and native borrow rules</tspan><tspan x="502" dy="17.25">Configured VM selector + callback/control shell</tspan><tspan x="502" dy="17.25">Wait mode + admission/drain + scanner/reader lifetime</tspan></text></g><g class="cm9vdHM="><g class="shape" ><rect x="526" y="198" width="459" height="130" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="755.5" y="236.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="755.5" dy="0">Existing root mechanisms</tspan><tspan x="755.5" dy="17">Frames / register writeback / RA / saved state</tspan><tspan x="755.5" dy="17">RC data slot and actual scan cohort</tspan><tspan x="755.5" dy="17">Still objects and VM-private cells</tspan><tspan x="755.5" dy="17">Reload moved values; do not scan arbitrary native payload</tspan></text></g><g class="YWRhcHRlcnM="><g class="shape" ><rect x="10" y="662" width="1006" height="174" stroke="#0D32B2" fill="#E3E9FD" class=" stroke-B1 fill-B4" style="stroke-width:2;" /></g><text x="513" y="649" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:28px">Matched native implementation alternatives</text></g><g class="dGFyZ2V0cw=="><g class="shape" ><rect x="266" y="956" width="472" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="502" y="994.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="502" dy="0">Selected consumers</tspan><tspan x="502" dy="17.25">Already-owned callbacks and BW1 waits first</tspan><tspan x="502" dy="17.25">NJS gateway and future LLVM products under same contract</tspan><tspan x="502" dy="17.25">Arbitrary attachment / BW2 / cross-VM switching separate</tspan></text></g><g class="Z2F0ZQ=="><g class="shape" ><rect x="241" y="1170" width="522" height="98" stroke="#0D32B2" fill="#fff0ce" class=" stroke-B1" style="stroke-width:2;" /></g><text x="502" y="1208.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="502" dy="0">Shared modernization versus language increment</tspan><tspan x="502" dy="17.666667">No current defect/GC speedup inferred from TODO or source branch</tspan><tspan x="502" dy="17.666667">No implementation, native tests or positive cost bound</tspan></text></g><g class="YWRhcHRlcnMuYw=="><g class="shape" ><rect x="520" y="700" width="466" height="98" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="753" y="738.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="753" dy="0">Modern C-G / C-ZT</tspan><tspan x="753" dy="17.666667">Opaque/generated operations + existing runtime primitives</tspan><tspan x="753" dy="17.666667">Same collector/member/control laws</tspan></text></g><g class="YWRhcHRlcnMueg=="><g class="shape" ><rect x="40" y="692" width="420" height="114" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="250" y="730.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="250" dy="0">Zig</tspan><tspan x="250" dy="17.25">Private typed products / propagation / native helpers</tspan><tspan x="250" dy="17.25">Same root/runtime/control obligations</tspan><tspan x="250" dy="17.25">Retain qualified C shell where needed</tspan></text></g><g class="KHNlbWFudGljIC0mZ3Q7IGNvbmRpdGlvbnMpWzBd"><marker id="mk-d2-287623572-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 247.25 100 C 247.25 138 247.25 158 247.25 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-287623572-3488378134)" mask="url(#d2-287